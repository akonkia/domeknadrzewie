<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-3WGXSZG17N"></script>
  <script>
  <title>Niebo dziś — widok z okna</title>
  <script src="https://cdn.jsdelivr.net/npm/suncalc@1.9.0/suncalc.js"></script>
  <style>
    :root {
      --ink: #2f3e34;
      --muted: #66776b;
      --card: rgba(255,255,255,0.56);
      --line: rgba(80, 102, 85, 0.14);
      --shadow: 0 18px 45px rgba(51, 66, 54, 0.12);
      --sun-size: 92px;
      --moon-size: 48px;
      --sky-top: #d9ebf6;
      --sky-bottom: #f3e4c9;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Georgia, "Times New Roman", serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 20% 20%, rgba(255,255,255,0.55), transparent 30%),
        linear-gradient(180deg, var(--sky-top) 0%, var(--sky-bottom) 58%, #e7dfcf 100%);
      padding: 24px;
      transition: background 1s ease;
    }

    .page-shell {
      width: min(1120px, 100%);
      margin: 0 auto;
      display: grid;
      gap: 18px;
    }

    .site-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 14px 18px;
      border-radius: 24px;
      background: rgba(255,255,255,0.62);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.55);
      box-shadow: 0 12px 30px rgba(51, 66, 54, 0.10);
    }

    .brand-block {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-logo {
      width: 54px;
      height: 54px;
      object-fit: contain;
      border-radius: 14px;
      background: rgba(255,255,255,0.7);
      padding: 4px;
      box-shadow: 0 4px 14px rgba(51, 66, 54, 0.08);
      flex: 0 0 auto;
    }

    .brand-text {
      display: grid;
      gap: 2px;
      min-width: 0;
    }

    .brand-link {
      color: var(--ink);
      text-decoration: none;
      font-size: 22px;
      line-height: 1.1;
      font-weight: 600;
      letter-spacing: 0.01em;
    }

    .brand-sub {
      color: var(--muted);
      font-size: 13px;
    }

    .site-nav {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: flex-end;
    }

    .site-nav a {
      display: inline-flex;
      align-items: center;
      padding: 9px 14px;
      border-radius: 999px;
      color: var(--ink);
      text-decoration: none;
      background: rgba(103, 135, 96, 0.10);
      border: 1px solid rgba(103, 135, 96, 0.10);
      transition: transform 0.15s ease, background 0.2s ease;
    }

    .site-nav a:hover {
      transform: translateY(-1px);
      background: rgba(103, 135, 96, 0.18);
    }

    .wrap {
      width: min(980px, 100%);
      display: grid;
      grid-template-columns: 1.2fr 0.8fr;
      gap: 20px;
    }

    .card {
      background: var(--card);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.5);
      border-radius: 28px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .sky-card {
      min-height: 460px;
      position: relative;
      padding: 26px;
      isolation: isolate;
    }

    .text-overlay {
      position: relative;
      z-index: 6;
      display: grid;
      justify-items: start;
      gap: 8px;
      max-width: 38ch;
    }

    .label {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      border-radius: 999px;
      background: rgba(255,255,255,0.84);
      border: 1px solid rgba(255,255,255,0.72);
      font-size: 14px;
      color: #334236;
      position: relative;
      z-index: 6;
      box-shadow: 0 8px 18px rgba(31, 42, 34, 0.08);
    }

    

    

    .sky {
      position: absolute;
      inset: 0;
      overflow: hidden;
      background: linear-gradient(180deg, var(--sky-top) 0%, var(--sky-bottom) 70%, rgba(245,241,232,0.14) 100%);
      transition: background 1.2s ease;
    }

    .sky::after {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 70% 20%, rgba(255,255,255,0.28), transparent 26%);
      pointer-events: none;
      opacity: 0.8;
      transition: opacity 1s ease;
    }

    .stars {
      position: absolute;
      inset: 0;
      opacity: 0;
      transition: opacity 1s ease;
      z-index: 1;
    }

    .constellation-layer {
      position: absolute;
      inset: 0;
      opacity: 0;
      transition: opacity 1s ease;
      z-index: 1;
      pointer-events: none;
    }

    .constellation-star {
      position: absolute;
      width: 6px;
      height: 6px;
      margin-left: -3px;
      margin-top: -3px;
      border-radius: 50%;
      background: rgba(255,255,255,0.95);
      box-shadow: 0 0 12px rgba(255,255,255,0.5);
    }

    .star {
      position: absolute;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: rgba(255,255,255,0.95);
      box-shadow: 0 0 10px rgba(255,255,255,0.7);
      animation: twinkle 4s ease-in-out infinite;
    }

    .sun, .moon {
      position: absolute;
      border-radius: 50%;
      transition: left 1s ease, top 1s ease, opacity 1s ease, transform 1s ease;
    }

    .sun {
      width: var(--sun-size);
      height: var(--sun-size);
      background: radial-gradient(circle at 35% 35%, #fff7d5 0%, #f5c768 58%, #e7ab3d 100%);
      box-shadow: 0 0 55px rgba(245, 199, 104, 0.45);
      opacity: 1;
      z-index: 2;
      animation: float 6s ease-in-out infinite;
    }

    .moon {
      width: var(--moon-size);
      height: var(--moon-size);
      background: #f0eee7;
      box-shadow: inset -12px 0 0 rgba(207, 205, 196, 0.8), 0 0 28px rgba(255,255,255,0.16);
      opacity: 0.15;
      z-index: 1;
    }

    .cloud-layer {
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
    }

    .cloud {
      position: absolute;
      background: rgba(255,255,255,0.9);
      border-radius: 999px;
      filter: blur(0.2px);
      opacity: 0.9;
      transition: opacity 0.8s ease;
      animation: cloudBreath 16s ease-in-out infinite;
      will-change: transform;
    }

    .cloud::before,
    .cloud::after {
      content: "";
      position: absolute;
      background: inherit;
      border-radius: 50%;
    }

    .cloud.one { width: 130px; height: 40px; top: 120px; left: 14%; animation-delay: 0s; }
    .cloud.one::before { width: 46px; height: 46px; left: 16px; top: -20px; }
    .cloud.one::after { width: 58px; height: 58px; right: 20px; top: -26px; }

    .cloud.two { width: 104px; height: 34px; top: 176px; right: 18%; opacity: 0.8; animation-delay: -5s; }
    .cloud.two::before { width: 34px; height: 34px; left: 10px; top: -15px; }
    .cloud.two::after { width: 44px; height: 44px; right: 14px; top: -18px; }

    .cloud.three { width: 160px; height: 46px; top: 86px; left: 42%; opacity: 0.45; animation-delay: -10s; }
    .cloud.three::before { width: 56px; height: 56px; left: 18px; top: -24px; }
    .cloud.three::after { width: 68px; height: 68px; right: 22px; top: -28px; }

    .rain {
      position: absolute;
      inset: 0;
      opacity: 0;
      transition: opacity 0.8s ease;
      z-index: 1;
      pointer-events: none;
    }

    .drop {
      position: absolute;
      width: 2px;
      height: 22px;
      background: linear-gradient(180deg, rgba(255,255,255,0.1), rgba(187,216,237,0.85));
      border-radius: 999px;
      animation: rain 1.2s linear infinite;
    }

    .birds {
      position: absolute;
      left: 74%;
      top: 112px;
      transform: translateX(-50%);
      color: rgba(70, 85, 71, 0.5);
      font-size: 26px;
      letter-spacing: 6px;
      transition: opacity 0.8s ease;
      z-index: 2;
      white-space: nowrap;
    }

    .window-frame,
    .window-bar,
    .window-sill,
    .glass-glow {
      position: absolute;
      pointer-events: none;
      z-index: 4;
    }

    .window-frame,
    .window-bar,
    .window-sill,
    .glass-glow {
      display: none;
    }

    .window-frame {
      inset: 14px;
      border: 10px solid rgba(255,255,255,0.36);
      border-radius: 24px;
      box-shadow:
        inset 0 0 0 1px rgba(255,255,255,0.28),
        inset 0 18px 30px rgba(255,255,255,0.08),
        inset 0 -18px 30px rgba(72, 81, 92, 0.08);
    }

    .window-bar.vertical {
      top: 24px;
      bottom: 24px;
      left: 50%;
      width: 8px;
      transform: translateX(-50%);
      background: linear-gradient(180deg, rgba(255,255,255,0.34) 0%, rgba(231,236,240,0.52) 50%, rgba(255,255,255,0.3) 100%);
      border-radius: 999px;
    }

    .window-bar.horizontal {
      left: 24px;
      right: 24px;
      top: 50%;
      height: 8px;
      transform: translateY(-50%);
      background: linear-gradient(90deg, rgba(255,255,255,0.28) 0%, rgba(231,236,240,0.5) 50%, rgba(255,255,255,0.28) 100%);
      border-radius: 999px;
    }

    .window-sill {
      left: 26px;
      right: 26px;
      bottom: 18px;
      height: 20px;
      border-radius: 999px;
      background: linear-gradient(180deg, rgba(255,255,255,0.22) 0%, rgba(219,225,230,0.42) 100%);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.35);
    }

    .glass-glow {
      inset: 26px;
      border-radius: 18px;
      background: linear-gradient(115deg, rgba(255,255,255,0.12) 0%, transparent 24%, transparent 72%, rgba(255,255,255,0.1) 100%);
      mix-blend-mode: screen;
    }

    .forecast {
      padding: 24px;
      display: grid;
      gap: 16px;
      align-content: start;
    }

    .temp {
      font-size: 48px;
      line-height: 1;
      margin: 0;
      font-weight: 500;
    }

    .state {
      margin: -6px 0 0;
      color: var(--muted);
      font-size: 18px;
    }

    .clock {
      margin-top: 10px;
      color: var(--muted);
      font-size: 15px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .mini {
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 16px;
      background: rgba(255,255,255,0.35);
    }

    .mini .k {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .mini .v {
      font-size: 20px;
    }

    .reflection {
      border-top: 1px solid var(--line);
      padding-top: 18px;
      color: var(--ink);
      font-size: 18px;
      line-height: 1.5;
      min-height: 100px;
    }

    .status-note {
      font-size: 13px;
      color: var(--muted);
      min-height: 18px;
    }

    .location-form {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .location-input {
      flex: 1 1 220px;
      min-width: 0;
      border: 1px solid rgba(103, 135, 96, 0.18);
      border-radius: 999px;
      padding: 10px 14px;
      font: inherit;
      color: var(--ink);
      background: rgba(255,255,255,0.7);
      outline: none;
    }

    .location-input:focus {
      border-color: rgba(103, 135, 96, 0.45);
      box-shadow: 0 0 0 3px rgba(103, 135, 96, 0.12);
    }

    .controls {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    button {
      border: 0;
      border-radius: 999px;
      padding: 10px 14px;
      background: rgba(103, 135, 96, 0.12);
      color: var(--ink);
      cursor: pointer;
      font: inherit;
      transition: transform 0.15s ease, background 0.2s ease;
    }

    button:hover {
      transform: translateY(-1px);
      background: rgba(103, 135, 96, 0.2);
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
      transform: none;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }

    @keyframes twinkle {
      0%, 100% { opacity: 0.4; transform: scale(0.95); }
      50% { opacity: 1; transform: scale(1.2); }
    }

    @keyframes rain {
      from { transform: translateY(-12px); opacity: 0; }
      15% { opacity: 1; }
      to { transform: translateY(28px); opacity: 0; }
    }

    @keyframes cloudBreath {
      0%, 100% { transform: translateX(0px) translateY(0px) scale(1); }
      50% { transform: translateX(10px) translateY(-4px) scale(1.03); }
    }

    @media (max-width: 820px) {
      .page-shell {
        gap: 14px;
      }

      .site-header {
        align-items: flex-start;
        flex-direction: column;
      }

      .site-nav {
        justify-content: flex-start;
      }

      .wrap { grid-template-columns: 1fr; }
      .sky-card { min-height: 360px; }
      .birds {
        left: 72%;
        top: 102px;
        font-size: 22px;
        letter-spacing: 5px;
      }
    }
      .sky-card { min-height: 360px; }
      .birds {
        left: 72%;
        top: 102px;
        font-size: 22px;
        letter-spacing: 5px;
      }
    }
  </style>
</head>
<body>
  <div class="page-shell">
    <header class="site-header">
      <div class="brand-block">
        <img class="brand-logo" id="brandLogo" src="https://raw.githubusercontent.com/akonkia/domeknadrzewie/main/assets/img/logo.png" alt="Logo Projektu Domek na Drzewie">
        <div class="brand-text">
          <a class="brand-link" id="brandLink" href="/">Projekt: Domek na Drzewie</a>
          <div class="brand-sub" id="brandSub">Niebo, pogoda i rytm dnia</div>
        </div>
      </div>
      <nav class="site-nav" aria-label="Site navigation">
        <a id="navHome" href="/">Strona główna</a>
        <a id="navSky" href="/sky.html">Niebo dziś</a>
        <a id="navLang" href="/en/sky.html">EN</a>
      </nav>
    </header>

    <div class="wrap">
    <section class="card sky-card">
      <div class="sky" id="sky">
        <div class="stars" id="stars"></div>
        <div class="constellation-layer" id="constellationLayer"></div>
        <div class="sun" id="sun"></div>
        <div class="moon" id="moon"></div>

        <div class="cloud-layer" id="cloudLayer">
          <div class="cloud one"></div>
          <div class="cloud two"></div>
          <div class="cloud three"></div>
        </div>

        <div class="rain" id="rain"></div>
        <div class="birds" id="birds">◠◡◠</div>

        <div class="window-frame" aria-hidden="true"></div>
        <div class="window-bar vertical" aria-hidden="true"></div>
        <div class="window-bar horizontal" aria-hidden="true"></div>
        <div class="window-sill" aria-hidden="true"></div>
        <div class="glass-glow" aria-hidden="true"></div>
      </div>

      <div class="text-overlay">
        <div class="label" id="placeLabel">Niebo dziś · Wrocław</div>
        
      </div>
    </section>

    <aside class="card forecast">
      <div>
        <p class="temp" id="temp">--°C</p>
        <p class="state" id="state">Ładowanie pogody…</p>
        <div class="clock" id="clock">Teraz: --:--</div>
      </div>

      <div class="grid">
        <div class="mini">
          <div class="k" id="labelSunrise">Wschód słońca</div>
          <div class="v" id="sunriseTime">--:--</div>
        </div>
        <div class="mini">
          <div class="k" id="labelSunset">Zachód słońca</div>
          <div class="v" id="sunsetTime">--:--</div>
        </div>
        <div class="mini">
          <div class="k" id="labelMoonPhase">Księżyc</div>
          <div class="v" id="moonPhase">Ładowanie</div>
        </div>
        <div class="mini">
          <div class="k" id="labelSky">Niebo</div>
          <div class="v" id="skyMood">--</div>
        </div>
        
        <div class="mini">
          <div class="k" id="labelMoonrise">Wschód księżyca</div>
          <div class="v" id="moonriseTime">--:--</div>
        </div>
        <div class="mini">
          <div class="k" id="labelMoonset">Zachód księżyca</div>
          <div class="v" id="moonsetTime">--:--</div>
        </div>
      </div>

      <div class="reflection" id="reflection">Chwilę… sprawdzam niebo.</div>
      <div class="status-note" id="statusNote"></div>

      <form class="location-form" id="locationForm">
        <input class="location-input" id="locationInput" type="text" placeholder="Wpisz miasto, np. Wrocław albo Tokyo" autocomplete="off" />
        <button type="submit" id="searchBtn">Zmień miejsce</button>
      </form>

      <div class="controls">
        <button type="button" id="refreshBtn">Odśwież dane</button>
        <button type="button" id="locateBtn">Użyj mojej lokalizacji</button>
      </div>
    </aside>
  </div>

  <script>
    const LANG = document.documentElement.lang && document.documentElement.lang.toLowerCase().startsWith('en') ? 'en' : 'pl';

    const UI_TEXT = {
      pl: {

    const DEFAULT_LOCATION = {

    function formatTime(dateString, timezone = currentLocation.timezone) {
      const date = new Date(dateString);
      return new Intl.DateTimeFormat('pl-PL', {
        hour: '2-digit',
        minute: '2-digit',
        hour12: false,
        timeZone: timezone
      }).format(date);
    }

    function getLocalDateParts(date, timezone) {
      const parts = new Intl.DateTimeFormat('en-CA', {
        timeZone: timezone,
        year: 'numeric',
        month: '2-digit',
        day: '2-digit'
      }).formatToParts(date);
      const map = Object.fromEntries(parts.map((p) => [p.type, p.value]));
      return {
        year: Number(map.year),
        month: Number(map.month),
        day: Number(map.day)
      };
    }

    function buildLocalNoon(date, timezone) {
      const { year, month, day } = getLocalDateParts(date, timezone);
      return new Date(year, month - 1, day, 12, 0, 0, 0);
    }

    function formatMoonEvent(date, timezone) {
      if (!(date instanceof Date) || Number.isNaN(date.getTime())) {
        return '—';
      }
      return new Intl.DateTimeFormat('pl-PL', {
        hour: '2-digit',
        minute: '2-digit',
        hour12: false,
        timeZone: timezone
      }).format(date);
    }

    function getNowInTimezone(timezone) {
      const now = new Date();
      return new Date(now.toLocaleString('en-US', { timeZone: timezone }));
    }

    function updateLivePositions() {
      updateClock();
      if (!liveSceneData) {
        return;
      }

      const timezone = liveSceneData.timezone || currentLocation.timezone || DEFAULT_LOCATION.timezone;
      const currentDate = getNowInTimezone(timezone);
      const liveCurrent = {
        time: currentDate.toISOString(),
        cloud_cover: liveSceneData.cloud_cover,
        weather_code: liveSceneData.weather_code,
        precipitation: liveSceneData.precipitation,
        is_day: currentDate >= liveSceneData.sunriseDate && currentDate <= liveSceneData.sunsetDate ? 1 : 0
      };

      const scene = getSceneFromWeather(liveCurrent, liveSceneData.sunriseDate, liveSceneData.sunsetDate);
      applyScene(scene, liveCurrent, liveSceneData.sunriseDate, liveSceneData.sunsetDate);
      const prominentConstellation = getProminentConstellation(currentDate, liveSceneData.latitude, liveSceneData.longitude, scene === 'night');
      renderConstellation(prominentConstellation, scene === 'night');
    }

    function moonPhaseFromDate(date) {
      const phases = ['Nów', 'Przybywający sierp', 'Pierwsza kwadra', 'Przybywający garb', 'Pełnia', 'Ubywający garb', 'Ostatnia kwadra', 'Ubywający sierp'];
      const knownNewMoon = new Date('2026-01-18T00:00:00Z');
      const synodicMonth = 29.53058867;
      const days = (date - knownNewMoon) / 86400000;
      const moonAge = ((days % synodicMonth) + synodicMonth) % synodicMonth;
      const index = Math.floor((moonAge / synodicMonth) * 8) % 8;
      return phases[index];
    }

    function moonPhaseFromIllumination(phaseValue) {
      if (typeof phaseValue !== 'number') {
        return null;
      }
      if (phaseValue < 0.0625 || phaseValue >= 0.9375) return 'Nów';
      if (phaseValue < 0.1875) return 'Przybywający sierp';
      if (phaseValue < 0.3125) return 'Pierwsza kwadra';
      if (phaseValue < 0.4375) return 'Przybywający garb';
      if (phaseValue < 0.5625) return 'Pełnia';
      if (phaseValue < 0.6875) return 'Ubywający garb';
      if (phaseValue < 0.8125) return 'Ostatnia kwadra';
      return 'Ubywający sierp';
    }

    function getAstronomyForDay(date, latitude, longitude, timezone) {
      if (!window.SunCalc) {
        return null;
      }

      const localNoon = buildLocalNoon(date, timezone);
      const sunTimes = window.SunCalc.getTimes(localNoon, latitude, longitude);
      const moonTimes = window.SunCalc.getMoonTimes(localNoon, latitude, longitude);
      const illumination = window.SunCalc.getMoonIllumination(localNoon);

      return {
        sunrise: sunTimes.sunrise || null,
        sunset: sunTimes.sunset || null,
        moonrise: moonTimes.rise || null,
        moonset: moonTimes.set || null,
        moonAlwaysUp: Boolean(moonTimes.alwaysUp),
        moonAlwaysDown: Boolean(moonTimes.alwaysDown),
        moonFraction: illumination?.fraction ?? null,
        moonPhaseValue: illumination?.phase ?? null
      };
    }

    function getBodyAltitudes(date, latitude, longitude) {
      if (!window.SunCalc) {
        return { sunAltitude: null, moonAltitude: null };
      }
      const sunPos = window.SunCalc.getPosition(date, latitude, longitude);
      const moonPos = window.SunCalc.getMoonPosition(date, latitude, longitude);
      return {
        sunAltitude: sunPos ? sunPos.altitude * 180 / Math.PI : null,
        moonAltitude: moonPos ? moonPos.altitude * 180 / Math.PI : null
      };
    }

    function clamp(value, min, max) {
      return Math.min(max, Math.max(min, value));
    }

    function normalizeHours(hours) {
      let value = hours % 24;
      if (value < 0) value += 24;
      return value;
    }

    function julianDate(date) {
      return date.getTime() / 86400000 + 2440587.5;
    }

    function localSiderealTimeHours(date, longitude) {
      const jd = julianDate(date);
      const d = jd - 2451545.0;
      const gmst = 18.697374558 + 24.06570982441908 * d;
      return normalizeHours(gmst + longitude / 15);
    }

    function radians(deg) {
      return (deg * Math.PI) / 180;
    }

    function altitudeDegrees(date, latitude, longitude, raHours, decDegrees) {
      const lst = localSiderealTimeHours(date, longitude);
      const hourAngleHours = normalizeHours(lst - raHours);
      const hourAngle = radians(hourAngleHours * 15);
      const lat = radians(latitude);
      const dec = radians(decDegrees);
      const altitude = Math.asin(
        Math.sin(lat) * Math.sin(dec) + Math.cos(lat) * Math.cos(dec) * Math.cos(hourAngle)
      );
      return altitude * 180 / Math.PI;
    }

    function getProminentConstellation(date, latitude, longitude, isNight) {
      if (!isNight) return null;
      let best = null;
      for (const item of prominentConstellations) {
        const altitude = altitudeDegrees(date, latitude, longitude, item.ra, item.dec);
        if (altitude < 8) continue;
        const score = altitude + (item.dec > 0 ? 2 : 0);
        if (!best || score > best.score) {
          best = { ...item, altitude, score };
        }
      }
      return best;
    }

    function renderConstellation(constellation, visible) {
      constellationLayer.innerHTML = '';
      constellationLayer.style.opacity = visible && constellation ? '1' : '0';
      if (!visible || !constellation) {
        return;
      }

      const anchorX = 58;
      const anchorY = 34;
      const scale = 1.2;
      const points = constellation.stars.map((star) => ({
        x: anchorX + (star.x - 50) * scale,
        y: anchorY + (star.y - 40) * scale
      }));

      for (const point of points) {
        const starEl = document.createElement('div');
        starEl.className = 'constellation-star';
        starEl.style.left = `${point.x}%`;
        starEl.style.top = `${point.y}%`;
        constellationLayer.appendChild(starEl);
      }
    }

    function getSceneFromWeather(current, sunriseDate, sunsetDate) {
      const currentTime = new Date(current.time);
      const sunrise = sunriseDate;
      const sunset = sunsetDate;
      const weatherCode = current.weather_code;
      const precipitation = current.precipitation || 0;

      if ([51, 53, 55, 61, 63, 65, 80, 81, 82].includes(weatherCode) || precipitation > 0.2) return 'rain';
      if (!current.is_day) return 'night';
      if (!(sunrise instanceof Date) || Number.isNaN(sunrise.getTime()) || !(sunset instanceof Date) || Number.isNaN(sunset.getTime())) {
        return current.is_day ? 'day' : 'night';
      }

      const dawnEnd = sunrise.getTime() + 90 * 60 * 1000;
      const duskStart = sunset.getTime() - 90 * 60 * 1000;

      if (currentTime.getTime() <= dawnEnd) return 'dawn';
      if (currentTime.getTime() >= duskStart) return 'dusk';
      return 'day';
    }

    function getSkyPalette(scene, cloudCover = 0) {
      const cloudFactor = clamp(cloudCover / 100, 0, 1);
      const palettes = {
        dawn: {
          bodyTop: '#cedfeb', bodyBottom: '#f2d9bb',
          skyTop: '#bcd7e6', skyBottom: '#f4cda8',
          sunOpacity: 1, moonOpacity: 0.2, stars: 0.08, birds: 0.55,
          sunPath: 0.16, moonPath: 0.86
        },
        day: {
          bodyTop: '#d7ebf7', bodyBottom: '#f3e3c7',
          skyTop: '#c4e0ef', skyBottom: '#f5dfbf',
          sunOpacity: 1, moonOpacity: 0.04, stars: 0, birds: 1,
          sunPath: 0.5, moonPath: 0.96
        },
        dusk: {
          bodyTop: '#7f97bc', bodyBottom: '#ebb88c',
          skyTop: '#809ec4', skyBottom: '#eda96e',
          sunOpacity: 0.9, moonOpacity: 0.24, stars: 0.18, birds: 0.35,
          sunPath: 0.84, moonPath: 0.14
        },
        night: {
          bodyTop: '#152235', bodyBottom: '#314564',
          skyTop: '#1c2940', skyBottom: '#374e73',
          sunOpacity: 0.03, moonOpacity: 1, stars: 1, birds: 0,
          sunPath: 1.06, moonPath: 0.52
        },
        rain: {
          bodyTop: '#8898a9', bodyBottom: '#c8c0b7',
          skyTop: '#91a3b4', skyBottom: '#cfc8bf',
          sunOpacity: 0.12, moonOpacity: 0.08, stars: 0, birds: 0,
          sunPath: 0.48, moonPath: 0.82
        }
      };

      const palette = palettes[scene];
      const extraCloud = scene === 'rain' ? 0.18 : 0;
      return {
        ...palette,
        clouds: clamp(0.3 + cloudFactor * 0.7 + extraCloud, 0.2, 1),
        rain: scene === 'rain' ? 1 : 0
      };
    }

    function applyScene(scene, current, sunriseDate, sunsetDate) {
      const palette = getSkyPalette(scene, current.cloud_cover || 0);
      document.body.style.setProperty('--sky-top', palette.bodyTop);
      document.body.style.setProperty('--sky-bottom', palette.bodyBottom);
      document.documentElement.style.setProperty('--sky-top', palette.skyTop);
      document.documentElement.style.setProperty('--sky-bottom', palette.skyBottom);

      const sunrise = sunriseDate;
      const sunset = sunsetDate;
      const now = new Date(current.time);
      const daylightTotal = (sunrise instanceof Date && sunset instanceof Date && !Number.isNaN(sunrise.getTime()) && !Number.isNaN(sunset.getTime()))
        ? Math.max(1, sunset.getTime() - sunrise.getTime())
        : 1;
      const daylightProgress = (sunrise instanceof Date && sunset instanceof Date && !Number.isNaN(sunrise.getTime()) && !Number.isNaN(sunset.getTime()))
        ? clamp((now.getTime() - sunrise.getTime()) / daylightTotal, 0, 1)
        : palette.sunPath;
      const sunPath = scene === 'night' ? palette.sunPath : daylightProgress;

      const bodyAltitudes = getBodyAltitudes(now, currentLocation.latitude, currentLocation.longitude);
      const sunVisible = typeof bodyAltitudes.sunAltitude === 'number' ? bodyAltitudes.sunAltitude > -0.8 : scene !== 'night';
      const moonVisible = typeof bodyAltitudes.moonAltitude === 'number' ? bodyAltitudes.moonAltitude > -0.8 : scene === 'night';

      const sunLeft = 10 + sunPath * 76;
      const sunTop = 250 - Math.sin(Math.PI * clamp(sunPath, 0, 1)) * 170;
      sun.style.left = `${sunLeft}%`;
      sun.style.top = `${sunTop}px`;
      sun.style.opacity = sunVisible ? palette.sunOpacity : 0;

      const moonSeed = (now.getHours() + now.getMinutes() / 60) / 24;
      const moonPath = scene === 'night' ? moonSeed : palette.moonPath;
      const moonLeft = 12 + moonPath * 72;
      const moonTop = 235 - Math.sin(Math.PI * clamp(moonPath, 0, 1)) * 155;
      moon.style.left = `${moonLeft}%`;
      moon.style.top = `${moonTop}px`;
      let moonOpacity = 0;
      if (moonVisible) {
        moonOpacity = scene === 'night' ? 1 : scene === 'day' ? 0.16 : Math.max(0.28, palette.moonOpacity);
      }
      moon.style.opacity = moonOpacity;
      moon.style.transform = scene === 'night' ? 'scale(1.05)' : 'scale(1)';

      stars.style.opacity = scene === 'night' ? palette.stars : 0;
      rain.style.opacity = palette.rain;
      birds.style.opacity = palette.birds;

      [...cloudLayer.children].forEach((cloud, index) => {
        cloud.style.opacity = Math.max(0, palette.clouds - index * 0.14);
      });
    }

    function simplifyPlaceName(value) {
      return (value || '')
        .toLowerCase()
        .normalize('NFD')
        .replace(/[̀-ͯ]/g, '')
        .replace(/ł/g, 'l')
        .replace(/ś/g, 's')
        .replace(/ć/g, 'c')
        .replace(/ż/g, 'z')
        .replace(/ź/g, 'z')
        .replace(/ń/g, 'n')
        .replace(/ó/g, 'o')
        .replace(/ą/g, 'a')
        .replace(/ę/g, 'e')
        .replace(/[^a-z0-9]+/g, ' ')
        .trim();
    }

    function buildLocationSearchCandidates(query) {
      const clean = query.trim();
      const simple = simplifyPlaceName(clean);
      const candidates = [clean];

      if (!/poland/i.test(clean) && !/polska/i.test(clean)) {
        candidates.push(`${clean}, Poland`);
        candidates.push(`${clean}, Polska`);
      }

      if (simple && simple !== clean.toLowerCase()) {
        candidates.push(simple);
        if (!/poland/i.test(simple) && !/polska/i.test(simple)) {
          candidates.push(`${simple}, Poland`);
          candidates.push(`${simple}, Polska`);
        }
      }

      return [...new Set(candidates)];
    }

    function scoreLocationResult(result, query) {
      const querySimple = simplifyPlaceName(query);
      const nameSimple = simplifyPlaceName(result.name || '');
      const adminSimple = simplifyPlaceName(result.admin1 || '');
      const countrySimple = simplifyPlaceName(result.country || '');
      let score = 0;

      if (nameSimple === querySimple) score += 140;
      if (nameSimple.startsWith(querySimple)) score += 80;
      if (nameSimple.includes(querySimple)) score += 50;
      if (querySimple.includes(nameSimple)) score += 20;
      if (adminSimple.includes(querySimple)) score += 20;
      if (countrySimple === 'poland' || result.country_code === 'PL') score += 50;
      if ((result.feature_code || '').startsWith('PPL')) score += 15;
      if (result.population) score += Math.min(20, Math.log10(result.population + 1) * 4);

      return score;
    }

    async function searchLocation(query) {
      const attempts = buildLocationSearchCandidates(query);
      let bestResult = null;
      let bestScore = -Infinity;

      for (const attempt of attempts) {
        const params = new URLSearchParams({
          name: attempt,
          count: '15',
          language: LANG,
          format: 'json'
        });

        const response = await fetch(`https://geocoding-api.open-meteo.com/v1/search?${params.toString()}`, {
          headers: { Accept: 'application/json' }
        });

        if (!response.ok) {
          throw new Error(`Geocoding HTTP ${response.status}`);
        }

        const data = await response.json();
        const results = Array.isArray(data.results) ? data.results : [];

        for (const result of results) {
          const score = scoreLocationResult(result, query);
          if (score > bestScore) {
            bestScore = score;
            bestResult = result;
          }
        }

        if (bestScore >= 140) {
          break;
        }
      }

      if (!bestResult) {
        throw new Error('location_not_found');
      }

      return {
        name: [bestResult.name, bestResult.admin1, bestResult.country].filter(Boolean).join(', '),
        latitude: bestResult.latitude,
        longitude: bestResult.longitude,
        timezone: bestResult.timezone || 'auto'
      };
    }

    async function fetchWeather(location) {
      const params = new URLSearchParams({
        latitude: String(location.latitude),
        longitude: String(location.longitude),
        current: 'temperature_2m,weather_code,cloud_cover,is_day,precipitation',
        daily: 'sunrise,sunset',
        timezone: location.timezone || 'auto',
        forecast_days: '1'
      });
      const url = `https://api.open-meteo.com/v1/forecast?${params.toString()}`;
      const response = await fetch(url, { headers: { Accept: 'application/json' } });
      if (!response.ok) {
        throw new Error(`HTTP ${response.status}`);
      }
      return response.json();
    }

    function applyWeather(data) {
      const current = data.current;
      if (!current) {
        throw new Error('Niepełne dane pogodowe');
      }

      lastWeather = data;
      const weatherInfo = weatherCodeMap[current.weather_code] || {
        label: { pl: 'Warunki zmienne', en: 'Variable conditions' },
        mood: { pl: 'Nieoczywiste', en: 'Uncertain' },
        reflection: { pl: 'Zobacz, jaka pogoda naprawdę tu jest.', en: 'Notice what the weather is actually doing here.' }
      };

      const timezone = data.timezone || currentLocation.timezone || DEFAULT_LOCATION.timezone;
      const currentDate = new Date(current.time);
      const astronomy = getAstronomyForDay(currentDate, currentLocation.latitude, currentLocation.longitude, timezone);
      const sunriseDate = astronomy?.sunrise || null;
      const sunsetDate = astronomy?.sunset || null;

      const scene = getSceneFromWeather(current, sunriseDate, sunsetDate);
      applyScene(scene, current, sunriseDate, sunsetDate);
      const prominentConstellation = getProminentConstellation(currentDate, currentLocation.latitude, currentLocation.longitude, scene === 'night');
      renderConstellation(prominentConstellation, scene === 'night');
      liveSceneData = {
        sunriseDate,
        sunsetDate,
        timezone,
        latitude: currentLocation.latitude,
        longitude: currentLocation.longitude,
        cloud_cover: current.cloud_cover || 0,
        weather_code: current.weather_code,
        precipitation: current.precipitation || 0,
        is_day: current.is_day
      };

      tempEl.textContent = `${Math.round(current.temperature_2m)}°C`;
      stateEl.textContent = weatherInfo.label[LANG] || weatherInfo.label.pl;
      skyMoodEl.textContent = weatherInfo.mood[LANG] || weatherInfo.mood.pl;
      sunriseTimeEl.textContent = sunriseDate ? formatMoonEvent(sunriseDate, timezone) : '—';
      sunsetTimeEl.textContent = sunsetDate ? formatMoonEvent(sunsetDate, timezone) : '—';
      moonPhaseEl.textContent = astronomy?.moonPhaseValue != null ? moonPhaseFromIllumination(astronomy.moonPhaseValue) : moonPhaseFromDate(currentDate);
      moonriseTimeEl.textContent = astronomy?.moonAlwaysUp ? t('allDay') : astronomy?.moonrise ? formatMoonEvent(astronomy.moonrise, timezone) : t('moonNeverRises');
      moonsetTimeEl.textContent = astronomy?.moonAlwaysDown ? t('moonNeverSets') : astronomy?.moonset ? formatMoonEvent(astronomy.moonset, timezone) : t('moonNeverSets');
      reflectionEl.textContent = weatherInfo.reflection[LANG] || weatherInfo.reflection.pl;
      placeLabelEl.textContent = `${t('placePrefix')} · ${currentLocation.name}`;
      statusNoteEl.textContent = `${t('sourcePrefix')} ${t('sourceValue')} · ${t('lastUpdate')} ${formatTime(current.time, timezone)}`;
      updateClock();
    }

    async function refreshWeather(showLoading = true) {
      try {
        refreshBtn.disabled = true;
        locateBtn.disabled = true;
        searchBtn.disabled = true;
        locationInput.disabled = true;

        if (showLoading) {
          stateEl.textContent = t('loadingWeather');
          statusNoteEl.textContent = t('fetchingLatest');
        }

        const data = await fetchWeather(currentLocation);
        if (data.timezone) {
          currentLocation.timezone = data.timezone;
        }
        applyWeather(data);
      } catch (error) {
        console.error(error);
        stateEl.textContent = t('refreshFailed');
        reflectionEl.textContent = t('calmWindow');
        statusNoteEl.textContent = t('weatherConnectionFailed');
        if (!lastWeather) {
          tempEl.textContent = '--°C';
          skyMoodEl.textContent = '--';
          sunriseTimeEl.textContent = '--:--';
          sunsetTimeEl.textContent = '--:--';
          moonPhaseEl.textContent = moonPhaseFromDate(new Date());
          moonriseTimeEl.textContent = '--:--';
          moonsetTimeEl.textContent = '--:--';
        }
      } finally {
        refreshBtn.disabled = false;
        locateBtn.disabled = false;
        searchBtn.disabled = false;
        locationInput.disabled = false;
      }
    }

    async function handleLocationSearch(event) {
      event.preventDefault();
      const query = locationInput.value.trim();
      if (!query) {
        statusNoteEl.textContent = t('typeLocation');
        return;
      }

      try {
        statusNoteEl.textContent = t('searchingPlace');
        searchBtn.disabled = true;
        locationInput.disabled = true;
        const foundLocation = await searchLocation(query);
        currentLocation = foundLocation;
        locationInput.value = foundLocation.name;
        await refreshWeather(true);
      } catch (error) {
        console.error(error);
        statusNoteEl.textContent = error.message === 'location_not_found' || error.message === 'Nie znaleziono lokalizacji'
          ? t('placeNotFound')
          : t('searchFailed');
      } finally {
        searchBtn.disabled = false;
        locationInput.disabled = false;
      }
    }

    function useBrowserLocation() {
      if (!navigator.geolocation) {
        statusNoteEl.textContent = t('geoUnavailable');
        return;
      }

      statusNoteEl.textContent = t('askGeo');
      navigator.geolocation.getCurrentPosition(
        async (position) => {
          currentLocation = {
            name: t('myLocation'),
            latitude: position.coords.latitude,
            longitude: position.coords.longitude,
            timezone: 'auto'
          };
          await refreshWeather(true);
        },
        () => {
          statusNoteEl.textContent = t('geoFailed');
        },
        { enableHighAccuracy: false, timeout: 10000, maximumAge: 300000 }
      );
    }

    function runSmokeTests() {
      console.assert(document.querySelector('meta[name="viewport"]') !== null, 'Viewport meta tag should exist');
      console.assert(typeof moonPhaseFromDate === 'function', 'moonPhaseFromDate should be defined');
      console.assert(typeof getAstronomyForDay === 'function', 'getAstronomyForDay should be defined');
      console.assert(document.getElementById('moonriseTime') !== null, 'Moonrise field should exist');
      console.assert(document.getElementById('moonsetTime') !== null, 'Moonset field should exist');
      console.assert(document.getElementById('labelSunrise') !== null, 'Sunrise label should exist');
      console.assert(document.getElementById('labelMoonset') !== null, 'Moonset label should exist');
      console.assert(document.getElementById('locationInput') !== null, 'Location input should exist');
      console.assert(document.getElementById('searchBtn') !== null, 'Search button should exist');
      console.assert(document.getElementById('navHome') !== null, 'Home navigation link should exist');
      console.assert(document.getElementById('brandLink') !== null, 'Brand link should exist');
      console.assert(document.getElementById('brandLogo') !== null, 'Brand logo should exist');
      console.assert(simplifyPlaceName('Ostrów Wielkopolski') === 'ostrow wielkopolski', 'Polish place normalization should work');
      console.assert(buildLocationSearchCandidates('Sopot').some((item) => item.includes('Poland') || item.includes('Polska')), 'Search should try Poland variants');
      const testAstronomy = getAstronomyForDay(new Date('2026-03-14T12:00:00Z'), DEFAULT_LOCATION.latitude, DEFAULT_LOCATION.longitude, DEFAULT_LOCATION.timezone);
      console.assert(testAstronomy === null || typeof testAstronomy === 'object', 'Astronomy data should be null or object');
      console.assert(moonPhaseFromIllumination(0) === 'Nów', 'Phase mapping should support new moon');
      console.assert(moonPhaseFromIllumination(0.5) === 'Pełnia', 'Phase mapping should support full moon');
      const bodyAltitudes = getBodyAltitudes(new Date('2026-03-14T12:00:00Z'), DEFAULT_LOCATION.latitude, DEFAULT_LOCATION.longitude);
      console.assert(bodyAltitudes === null || typeof bodyAltitudes.sunAltitude === 'number' || bodyAltitudes.sunAltitude === null, 'Body altitude helper should return numeric or null altitudes');
      const testConstellation = getProminentConstellation(new Date('2026-01-15T21:00:00Z'), DEFAULT_LOCATION.latitude, DEFAULT_LOCATION.longitude, true);
      console.assert(testConstellation === null || typeof testConstellation.name === 'string', 'Constellation selection should return null or named object');
    }

    refreshBtn.addEventListener('click', () => refreshWeather(true));
    locateBtn.addEventListener('click', useBrowserLocation);
    locationForm.addEventListener('submit', handleLocationSearch);
    searchBtn.addEventListener('click', (event) => {
      event.preventDefault();
      handleLocationSearch(event);
    });

    applyStaticText();
    runSmokeTests();
    refreshWeather(true);
    updateLivePositions();
    setInterval(updateLivePositions, 60000);
    setInterval(() => refreshWeather(false), 15 * 60 * 1000);
  </script>
  </div>

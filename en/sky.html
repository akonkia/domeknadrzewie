<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Niebo dziś — widok z okna</title>
  <script src="https://cdn.jsdelivr.net/npm/suncalc@1.9.0/suncalc.js"></script>
  <style>
    :root {
      --ink: #2f3e34;
      --muted: #66776b;
      --card: rgba(255,255,255,0.56);
      --line: rgba(80, 102, 85, 0.14);
      --shadow: 0 18px 45px rgba(51, 66, 54, 0.12);
      --sun-size: 92px;
      --moon-size: 48px;
      --sky-top: #d9ebf6;
      --sky-bottom: #f3e4c9;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Georgia, "Times New Roman", serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 20% 20%, rgba(255,255,255,0.55), transparent 30%),
        linear-gradient(180deg, var(--sky-top) 0%, var(--sky-bottom) 58%, #e7dfcf 100%);
      display: grid;
      place-items: center;
      padding: 24px;
      transition: background 1s ease;
    }

    .wrap {
      width: min(980px, 100%);
      display: grid;
      grid-template-columns: 1.2fr 0.8fr;
      gap: 20px;
    }

    .card {
      background: var(--card);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.5);
      border-radius: 28px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .sky-card {
      min-height: 460px;
      position: relative;
      padding: 26px;
      isolation: isolate;
    }

    .text-overlay {
      position: relative;
      z-index: 6;
      display: grid;
      justify-items: start;
      gap: 8px;
      max-width: 38ch;
    }

    .label {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      border-radius: 999px;
      background: rgba(255,255,255,0.84);
      border: 1px solid rgba(255,255,255,0.72);
      font-size: 14px;
      color: #334236;
      position: relative;
      z-index: 6;
      box-shadow: 0 8px 18px rgba(31, 42, 34, 0.08);
    }

    .sky {
      position: absolute;
      inset: 0;
      overflow: hidden;
      background: linear-gradient(180deg, var(--sky-top) 0%, var(--sky-bottom) 70%, rgba(245,241,232,0.14) 100%);
      transition: background 1.2s ease;
    }

    .sky::after {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 70% 20%, rgba(255,255,255,0.28), transparent 26%);
      pointer-events: none;
      opacity: 0.8;
      transition: opacity 1s ease;
    }

    .stars {
      position: absolute;
      inset: 0;
      opacity: 0;
      transition: opacity 1s ease;
      z-index: 1;
    }

    .constellation-layer {
      position: absolute;
      inset: 0;
      opacity: 0;
      transition: opacity 1s ease;
      z-index: 1;
      pointer-events: none;
    }

    .constellation-star {
      position: absolute;
      width: 6px;
      height: 6px;
      margin-left: -3px;
      margin-top: -3px;
      border-radius: 50%;
      background: rgba(255,255,255,0.95);
      box-shadow: 0 0 12px rgba(255,255,255,0.5);
    }

    .star {
      position: absolute;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: rgba(255,255,255,0.95);
      box-shadow: 0 0 10px rgba(255,255,255,0.7);
      animation: twinkle 4s ease-in-out infinite;
    }

    .sun, .moon {
      position: absolute;
      border-radius: 50%;
      transition: left 1s ease, top 1s ease, opacity 1s ease, transform 1s ease;
    }

    .sun {
      width: var(--sun-size);
      height: var(--sun-size);
      background: radial-gradient(circle at 35% 35%, #fff7d5 0%, #f5c768 58%, #e7ab3d 100%);
      box-shadow: 0 0 55px rgba(245, 199, 104, 0.45);
      opacity: 1;
      z-index: 2;
      animation: float 6s ease-in-out infinite;
    }

    .moon {
      width: var(--moon-size);
      height: var(--moon-size);
      background: #f0eee7;
      box-shadow: inset -12px 0 0 rgba(207, 205, 196, 0.8), 0 0 28px rgba(255,255,255,0.16);
      opacity: 0.15;
      z-index: 1;
    }

    .cloud-layer {
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
    }

    .cloud {
      position: absolute;
      background: rgba(255,255,255,0.9);
      border-radius: 999px;
      filter: blur(0.2px);
      opacity: 0.9;
      transition: opacity 0.8s ease;
      animation: cloudBreath 16s ease-in-out infinite;
      will-change: transform;
    }

    .cloud::before,
    .cloud::after {
      content: "";
      position: absolute;
      background: inherit;
      border-radius: 50%;
    }

    .cloud.one { width: 130px; height: 40px; top: 120px; left: 14%; animation-delay: 0s; }
    .cloud.one::before { width: 46px; height: 46px; left: 16px; top: -20px; }
    .cloud.one::after { width: 58px; height: 58px; right: 20px; top: -26px; }

    .cloud.two { width: 104px; height: 34px; top: 176px; right: 18%; opacity: 0.8; animation-delay: -5s; }
    .cloud.two::before { width: 34px; height: 34px; left: 10px; top: -15px; }
    .cloud.two::after { width: 44px; height: 44px; right: 14px; top: -18px; }

    .cloud.three { width: 160px; height: 46px; top: 86px; left: 42%; opacity: 0.45; animation-delay: -10s; }
    .cloud.three::before { width: 56px; height: 56px; left: 18px; top: -24px; }
    .cloud.three::after { width: 68px; height: 68px; right: 22px; top: -28px; }

    .rain,
    .snow {
      position: absolute;
      inset: 0;
      opacity: 0;
      transition: opacity 0.8s ease;
      pointer-events: none;
    }

    .rain {
      z-index: 1;
    }

    .snow {
      z-index: 3;
    }

    .drop {
      position: absolute;
      width: 2px;
      height: 22px;
      background: linear-gradient(180deg, rgba(255,255,255,0.1), rgba(187,216,237,0.85));
      border-radius: 999px;
      animation: rain 1.2s linear infinite;
    }

    .flake {
      position: absolute;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, rgba(255,255,255,1) 0%, rgba(255,255,255,0.98) 45%, rgba(220,235,245,0.92) 100%);
      box-shadow: 0 0 14px rgba(255,255,255,0.5);
      animation: snowfall 5.8s linear infinite;
    }

    .birds {
      position: absolute;
      right: 18%;
      top: 100px;
      color: rgba(70, 85, 71, 0.5);
      font-size: 26px;
      letter-spacing: 6px;
      transition: opacity 0.8s ease;
      z-index: 2;
    }

    .window-frame,
    .window-bar,
    .window-sill,
    .glass-glow {
      position: absolute;
      pointer-events: none;
    }

    .window-frame,
    .window-bar,
    .window-sill,
    .glass-glow {
      z-index: 4;
    }

    .forecast {
      padding: 24px;
      display: grid;
      gap: 16px;
      align-content: start;
    }

    .temp {
      font-size: 48px;
      line-height: 1;
      margin: 0;
      font-weight: 500;
    }

    .state {
      margin: -6px 0 0;
      color: var(--muted);
      font-size: 18px;
    }

    .clock {
      margin-top: 10px;
      color: var(--muted);
      font-size: 15px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .mini {
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 16px;
      background: rgba(255,255,255,0.35);
    }

    .mini .k {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .mini .v {
      font-size: 20px;
    }

    .reflection {
      border-top: 1px solid var(--line);
      padding-top: 18px;
      color: var(--ink);
      font-size: 18px;
      line-height: 1.5;
      min-height: 100px;
    }

    .status-note {
      font-size: 13px;
      color: var(--muted);
      min-height: 18px;
    }

    .location-form {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .location-input {
      flex: 1 1 220px;
      min-width: 0;
      border: 1px solid rgba(103, 135, 96, 0.18);
      border-radius: 999px;
      padding: 10px 14px;
      font: inherit;
      color: var(--ink);
      background: rgba(255,255,255,0.7);
      outline: none;
    }

    .location-input:focus {
      border-color: rgba(103, 135, 96, 0.45);
      box-shadow: 0 0 0 3px rgba(103, 135, 96, 0.12);
    }

    .controls {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    button {
      border: 0;
      border-radius: 999px;
      padding: 10px 14px;
      background: rgba(103, 135, 96, 0.12);
      color: var(--ink);
      cursor: pointer;
      font: inherit;
      transition: transform 0.15s ease, background 0.2s ease;
    }

    button:hover {
      transform: translateY(-1px);
      background: rgba(103, 135, 96, 0.2);
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
      transform: none;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }

    @keyframes twinkle {
      0%, 100% { opacity: 0.4; transform: scale(0.95); }
      50% { opacity: 1; transform: scale(1.2); }
    }

    @keyframes rain {
      from { transform: translateY(-12px); opacity: 0; }
      15% { opacity: 1; }
      to { transform: translateY(28px); opacity: 0; }
    }

    @keyframes cloudBreath {
      0%, 100% { transform: translateX(0px) translateY(0px) scale(1); }
      50% { transform: translateX(10px) translateY(-4px) scale(1.03); }
    }

    @keyframes snowfall {
      0% { transform: translateY(-24px) translateX(0px) scale(0.85); opacity: 0; }
      8% { opacity: 1; }
      30% { transform: translateY(110px) translateX(18px) scale(1); opacity: 1; }
      60% { transform: translateY(240px) translateX(-14px) scale(1.06); opacity: 0.95; }
      100% { transform: translateY(460px) translateX(12px) scale(1.1); opacity: 0; }
    }

    @media (max-width: 820px) {
      .wrap { grid-template-columns: 1fr; }
      .sky-card { min-height: 360px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <section class="card sky-card">
      <div class="sky" id="sky">
        <div class="stars" id="stars"></div>
        <div class="constellation-layer" id="constellationLayer"></div>
        <div class="sun" id="sun"></div>
        <div class="moon" id="moon"></div>

        <div class="cloud-layer" id="cloudLayer">
          <div class="cloud one"></div>
          <div class="cloud two"></div>
          <div class="cloud three"></div>
        </div>

        <div class="rain" id="rain"></div>
        <div class="snow" id="snow"></div>
        <div class="birds" id="birds">◠◡◠</div>

        <div class="window-frame" aria-hidden="true"></div>
        <div class="window-bar vertical" aria-hidden="true"></div>
        <div class="window-bar horizontal" aria-hidden="true"></div>
        <div class="window-sill" aria-hidden="true"></div>
        <div class="glass-glow" aria-hidden="true"></div>
      </div>

      <div class="text-overlay">
        <div class="label" id="placeLabel">Niebo dziś · Wrocław</div>
      </div>
    </section>

    <aside class="card forecast">
      <div>
        <p class="temp" id="temp">--°C</p>
        <p class="state" id="state">Ładowanie pogody…</p>
        <div class="status-note" id="conditionDetail"></div>
        <div class="clock" id="clock">Teraz: --:--</div>
      </div>

      <div class="grid">
        <div class="mini">
          <div class="k" id="labelSunrise">Wschód słońca</div>
          <div class="v" id="sunriseTime">--:--</div>
        </div>
        <div class="mini">
          <div class="k" id="labelSunset">Zachód słońca</div>
          <div class="v" id="sunsetTime">--:--</div>
        </div>
        <div class="mini">
          <div class="k" id="labelMoonPhase">Księżyc</div>
          <div class="v" id="moonPhase">Ładowanie</div>
        </div>
        <div class="mini">
          <div class="k" id="labelSky">Niebo</div>
          <div class="v" id="skyMood">--</div>
        </div>
        <div class="mini">
          <div class="k" id="labelMoonrise">Wschód księżyca</div>
          <div class="v" id="moonriseTime">--:--</div>
        </div>
        <div class="mini">
          <div class="k" id="labelMoonset">Zachód księżyca</div>
          <div class="v" id="moonsetTime">--:--</div>
        </div>
      </div>

      <div class="reflection" id="reflection">Chwilę… sprawdzam niebo.</div>
      <div class="status-note" id="statusNote"></div>

      <form class="location-form" id="locationForm">
        <input class="location-input" id="locationInput" type="text" placeholder="Wpisz miasto, np. Wrocław albo Tokyo" autocomplete="off" />
        <button type="submit" id="searchBtn">Zmień miejsce</button>
      </form>

      <div class="controls">
        <button type="button" id="refreshBtn">Odśwież dane</button>
        <button type="button" id="locateBtn">Użyj mojej lokalizacji</button>
      </div>
    </aside>
  </div>

  <script>
    const LANG = document.documentElement.lang && document.documentElement.lang.toLowerCase().startsWith('en') ? 'en' : 'pl';

    const UI_TEXT = {
      pl: {
        placePrefix: 'Niebo dziś',
        loadingWeather: 'Ładowanie pogody…',
        nowPrefix: 'Teraz',
        sunrise: 'Wschód słońca',
        sunset: 'Zachód słońca',
        moon: 'Księżyc',
        sky: 'Niebo',
        moonrise: 'Wschód księżyca',
        moonset: 'Zachód księżyca',
        checkingSky: 'Chwilę… sprawdzam niebo.',
        searchPlaceholder: 'Wpisz miasto, np. Wrocław albo Tokyo',
        changePlace: 'Zmień miejsce',
        refresh: 'Odśwież dane',
        useMyLocation: 'Użyj mojej lokalizacji',
        sourcePrefix: 'Źródło:',
        sourceValue: 'Open-Meteo (pogoda) + SunCalc (astronomia dnia)',
        lastUpdate: 'ostatnia aktualizacja',
        typeLocation: 'Wpisz nazwę miasta lub miejsca.',
        searchingPlace: 'Szukam miejsca…',
        placeNotFound: 'Nie znalazłam takiego miejsca. Spróbuj pełniejszej nazwy.',
        searchFailed: 'Nie udało się wyszukać miejsca. Spróbuj ponownie.',
        geoUnavailable: 'Ta przeglądarka nie udostępnia lokalizacji. Zostaje Wrocław.',
        askGeo: 'Proszę o dostęp do lokalizacji…',
        geoFailed: 'Nie udało się pobrać lokalizacji. Zostaje Wrocław.',
        fetchingLatest: 'Pobieram najnowsze dane.',
        refreshFailed: 'Nie udało się odświeżyć',
        calmWindow: 'Na razie zostawiam okno spokojne. Spróbuj odświeżyć za chwilę.',
        weatherConnectionFailed: 'Błąd połączenia z pogodą. Zostają ostatnie dostępne dane lub widok domyślny.',
        moonNeverRises: 'Księżyc pozostaje poniżej horyzontu',
        moonNeverSets: 'Księżyc pozostaje nad horyzontem',
        allDay: 'Widoczny przez całą dobę',
        myLocation: 'Twoja lokalizacja'
      },
      en: {
        placePrefix: 'Sky today',
        loadingWeather: 'Loading weather…',
        nowPrefix: 'Now',
        sunrise: 'Sunrise',
        sunset: 'Sunset',
        moon: 'Moon',
        sky: 'Sky',
        moonrise: 'Moonrise',
        moonset: 'Moonset',
        checkingSky: 'One moment… checking the sky.',
        searchPlaceholder: 'Enter a city, e.g. Wrocław or Tokyo',
        changePlace: 'Change place',
        refresh: 'Refresh data',
        useMyLocation: 'Use my location',
        sourcePrefix: 'Source:',
        sourceValue: 'Open-Meteo (weather) + SunCalc (daily astronomy)',
        lastUpdate: 'last update',
        typeLocation: 'Enter a city or place name.',
        searchingPlace: 'Searching for place…',
        placeNotFound: 'That place was not found. Try a fuller name.',
        searchFailed: 'Could not search for that place. Please try again.',
        geoUnavailable: 'This browser does not provide location. Staying with Wrocław.',
        askGeo: 'Requesting location access…',
        geoFailed: 'Could not get your location. Staying with Wrocław.',
        fetchingLatest: 'Fetching the latest data.',
        refreshFailed: 'Could not refresh',
        calmWindow: 'Leaving the window calm for now. Try refreshing in a moment.',
        weatherConnectionFailed: 'Weather connection failed. Keeping the last available data or fallback view.',
        moonNeverRises: 'Moon stays below the horizon',
        moonNeverSets: 'Moon stays above the horizon',
        allDay: 'Visible all day',
        myLocation: 'Your location'
      }
    };

    const t = (key) => UI_TEXT[LANG][key] ?? key;

    const DEFAULT_LOCATION = { name: 'Wrocław', latitude: 51.1079, longitude: 17.0385, timezone: 'Europe/Warsaw' };

    const sun = document.getElementById('sun');
    const moon = document.getElementById('moon');
    const stars = document.getElementById('stars');
    const rain = document.getElementById('rain');
    const snow = document.getElementById('snow');
    const cloudLayer = document.getElementById('cloudLayer');
    const constellationLayer = document.getElementById('constellationLayer');
    const birds = document.getElementById('birds');
    const skyCard = document.querySelector('.sky-card');

    const tempEl = document.getElementById('temp');
    const stateEl = document.getElementById('state');
    const conditionDetailEl = document.getElementById('conditionDetail');
    const skyMoodEl = document.getElementById('skyMood');
    const moonPhaseEl = document.getElementById('moonPhase');
    const reflectionEl = document.getElementById('reflection');
    const clockEl = document.getElementById('clock');
    const placeLabelEl = document.getElementById('placeLabel');
    const sunriseTimeEl = document.getElementById('sunriseTime');
    const sunsetTimeEl = document.getElementById('sunsetTime');
    const moonriseTimeEl = document.getElementById('moonriseTime');
    const moonsetTimeEl = document.getElementById('moonsetTime');
    const statusNoteEl = document.getElementById('statusNote');
    const refreshBtn = document.getElementById('refreshBtn');
    const locateBtn = document.getElementById('locateBtn');
    const locationForm = document.getElementById('locationForm');
    const locationInput = document.getElementById('locationInput');
    const searchBtn = document.getElementById('searchBtn');

    let currentLocation = { ...DEFAULT_LOCATION };
    let lastWeather = null;
    let liveSceneData = null;

    for (let i = 0; i < 18; i += 1) {
      const s = document.createElement('span');
      s.className = 'star';
      s.style.left = `${8 + Math.random() * 82}%`;
      s.style.top = `${8 + Math.random() * 46}%`;
      s.style.animationDelay = `${Math.random() * 4}s`;
      stars.appendChild(s);
    }

    for (let i = 0; i < 24; i += 1) {
      const d = document.createElement('span');
      d.className = 'drop';
      d.style.left = `${8 + Math.random() * 84}%`;
      d.style.top = `${18 + Math.random() * 42}%`;
      d.style.animationDelay = `${Math.random() * 1.2}s`;
      d.style.animationDuration = `${0.9 + Math.random() * 0.5}s`;
      rain.appendChild(d);
    }

    for (let i = 0; i < 110; i += 1) {
      const f = document.createElement('span');
      f.className = 'flake';
      const size = 3 + Math.random() * 7;
      f.style.width = `${size}px`;
      f.style.height = `${size}px`;
      f.style.left = `${4 + Math.random() * 92}%`;
      f.style.top = `${-20 - Math.random() * 80}px`;
      f.style.opacity = `${0.45 + Math.random() * 0.5}`;
      f.style.animationDelay = `-${Math.random() * 7}s`;
      f.style.animationDuration = `${5 + Math.random() * 6}s`;
      snow.appendChild(f);
    }

    function formatNumber(value, digits = 1) {
      return Number.isFinite(value) ? value.toFixed(digits) : null;
    }

    const prominentConstellations = [
      { name: 'Orion', ra: 5.5, dec: 0, stars: [{x:18,y:26},{x:32,y:18},{x:44,y:34},{x:56,y:46},{x:68,y:56},{x:36,y:40},{x:43,y:43},{x:50,y:46}] },
      { name: 'Ursa Major', ra: 11.2, dec: 56, stars: [{x:14,y:58},{x:28,y:52},{x:42,y:50},{x:56,y:54},{x:68,y:44},{x:80,y:34},{x:90,y:24}] },
      { name: 'Cassiopeia', ra: 1.0, dec: 60, stars: [{x:12,y:42},{x:28,y:24},{x:44,y:42},{x:60,y:24},{x:76,y:42}] },
      { name: 'Cygnus', ra: 20.7, dec: 42, stars: [{x:50,y:16},{x:50,y:34},{x:50,y:56},{x:34,y:40},{x:66,y:40}] },
      { name: 'Scorpius', ra: 16.9, dec: -30, stars: [{x:16,y:24},{x:30,y:34},{x:42,y:46},{x:52,y:56},{x:64,y:66},{x:78,y:60},{x:88,y:72}] },
      { name: 'Leo', ra: 10.7, dec: 16, stars: [{x:20,y:28},{x:36,y:22},{x:48,y:30},{x:38,y:42},{x:54,y:44},{x:72,y:48}] },
      { name: 'Taurus', ra: 4.6, dec: 18, stars: [{x:18,y:28},{x:34,y:42},{x:48,y:28},{x:62,y:16},{x:62,y:44},{x:80,y:34}] },
      { name: 'Gemini', ra: 7.1, dec: 22, stars: [{x:30,y:16},{x:30,y:34},{x:30,y:54},{x:60,y:14},{x:60,y:34},{x:60,y:54}] },
      { name: 'Sagittarius', ra: 19.1, dec: -27, stars: [{x:18,y:46},{x:32,y:34},{x:48,y:24},{x:60,y:36},{x:48,y:50},{x:34,y:58},{x:66,y:52},{x:80,y:60}] },
      { name: 'Pegasus', ra: 22.8, dec: 20, stars: [{x:24,y:26},{x:60,y:24},{x:64,y:58},{x:28,y:60}] }
    ];

    function getNearestHourlySample(data, targetTime) {
      const hourly = data?.hourly;
      if (!hourly?.time || !Array.isArray(hourly.time) || hourly.time.length === 0) {
        return null;
      }
      const target = asDate(targetTime).getTime();
      let bestIndex = 0;
      let bestDiff = Infinity;
      for (let i = 0; i < hourly.time.length; i += 1) {

      }).format(date);
    }

    function getLocalDateParts(date, timezone) {
      const parts = new Intl.DateTimeFormat('en-CA', { timeZone: timezone, year: 'numeric', month: '2-digit', day: '2-digit' }).formatToParts(date);
      const map = Object.fromEntries(parts.map((p) => [p.type, p.value]));
      return { year: Number(map.year), month: Number(map.month), day: Number(map.day) };
    }

    function buildLocalNoon(date, timezone) {
      const { year, month, day } = getLocalDateParts(date, timezone);
      return new Date(year, month - 1, day, 12, 0, 0, 0);
    }

    function formatMoonEvent(date, timezone) {
      if (!(date instanceof Date) || Number.isNaN(date.getTime())) return '—';
      return new Intl.DateTimeFormat(LANG === 'en' ? 'en-GB' : 'pl-PL', {
        hour: '2-digit', minute: '2-digit', hour12: false, timeZone: timezone
      }).format(date);
    }

    function applyStaticText() {
      const setText = (id, value) => { const el = document.getElementById(id); if (el) el.textContent = value; };
      setText('labelSunrise', t('sunrise'));
      setText('labelSunset', t('sunset'));
      setText('labelMoonPhase', t('moon'));
      setText('labelSky', t('sky'));
      setText('labelMoonrise', t('moonrise'));
      setText('labelMoonset', t('moonset'));
      locationInput.placeholder = t('searchPlaceholder');
      searchBtn.textContent = t('changePlace');
      refreshBtn.textContent = t('refresh');
      locateBtn.textContent = t('useMyLocation');
      stateEl.textContent = t('loadingWeather');
      conditionDetailEl.textContent = '';
      reflectionEl.textContent = t('checkingSky');
      placeLabelEl.textContent = `${t('placePrefix')} · ${currentLocation.name}`;
    }

    function updateClock() {
      const time = new Intl.DateTimeFormat(LANG === 'en' ? 'en-GB' : 'pl-PL', {
        hour: '2-digit', minute: '2-digit', hour12: false, timeZone: currentLocation.timezone || DEFAULT_LOCATION.timezone
      }).format(new Date());
      clockEl.textContent = `${t('nowPrefix')}: ${time}`;
    }

    function getNowInTimezone() {
      return new Date();
    }

    function updateLivePositions() {
      updateClock();
      if (!liveSceneData) return;
      const timezone = liveSceneData.timezone || currentLocation.timezone || DEFAULT_LOCATION.timezone;
      const currentDate = getNowInTimezone();
      const bodyAltitudes = getBodyAltitudes(currentDate, liveSceneData.latitude, liveSceneData.longitude);
      const liveCurrent = {
        time: currentDate.getTime(),
        cloud_cover: liveSceneData.cloud_cover,
        weather_code: liveSceneData.weather_code,
        precipitation: liveSceneData.precipitation,
        snowfall: liveSceneData.snowfall || 0,
        showers: liveSceneData.showers || 0,
        is_day: typeof bodyAltitudes.sunAltitude === 'number' ? (bodyAltitudes.sunAltitude > -0.8 ? 1 : 0) : 0
      };
      const scene = getSceneFromWeather(liveCurrent, liveSceneData.sunriseDate, liveSceneData.sunsetDate);
      applyScene(scene, liveCurrent, liveSceneData.sunriseDate, liveSceneData.sunsetDate);
      const prominentConstellation = getProminentConstellation(currentDate, liveSceneData.latitude, liveSceneData.longitude, scene === 'night');
      renderConstellation(prominentConstellation, scene === 'night');
    }

    function moonPhaseFromDate(date) {
      const phases = LANG === 'en'
        ? ['New moon','Waxing crescent','First quarter','Waxing gibbous','Full moon','Waning gibbous','Last quarter','Waning crescent']
        : ['Nów','Przybywający sierp','Pierwsza kwadra','Przybywający garb','Pełnia','Ubywający garb','Ostatnia kwadra','Ubywający sierp'];
      const knownNewMoon = new Date('2026-01-18T00:00:00Z');
      const synodicMonth = 29.53058867;
      const days = (date - knownNewMoon) / 86400000;
      const moonAge = ((days % synodicMonth) + synodicMonth) % synodicMonth;
      const index = Math.floor((moonAge / synodicMonth) * 8) % 8;
      return phases[index];
    }

    function moonPhaseFromIllumination(phaseValue) {
      const phases = LANG === 'en'
        ? ['New moon','Waxing crescent','First quarter','Waxing gibbous','Full moon','Waning gibbous','Last quarter','Waning crescent']
        : ['Nów','Przybywający sierp','Pierwsza kwadra','Przybywający garb','Pełnia','Ubywający garb','Ostatnia kwadra','Ubywający sierp'];
      if (typeof phaseValue !== 'number') return null;
      if (phaseValue < 0.0625 || phaseValue >= 0.9375) return phases[0];
      if (phaseValue < 0.1875) return phases[1];
      if (phaseValue < 0.3125) return phases[2];
      if (phaseValue < 0.4375) return phases[3];
      if (phaseValue < 0.5625) return phases[4];
      if (phaseValue < 0.6875) return phases[5];
      if (phaseValue < 0.8125) return phases[6];
      return phases[7];
    }

    function getAstronomyForDay(date, latitude, longitude, timezone) {
      if (!window.SunCalc) return null;
      const localNoon = buildLocalNoon(date, timezone);
      const sunTimes = window.SunCalc.getTimes(localNoon, latitude, longitude);
      const moonTimes = window.SunCalc.getMoonTimes(localNoon, latitude, longitude);
      const illumination = window.SunCalc.getMoonIllumination(localNoon);
      return {
        sunrise: sunTimes.sunrise || null,
        sunset: sunTimes.sunset || null,
        moonrise: moonTimes.rise || null,
        moonset: moonTimes.set || null,
        moonAlwaysUp: Boolean(moonTimes.alwaysUp),
        moonAlwaysDown: Boolean(moonTimes.alwaysDown),
        moonPhaseValue: illumination?.phase ?? null
      };
    }

    function getBodyAltitudes(date, latitude, longitude) {
      if (!window.SunCalc) return { sunAltitude: null, moonAltitude: null };
      const sunPos = window.SunCalc.getPosition(date, latitude, longitude);
      const moonPos = window.SunCalc.getMoonPosition(date, latitude, longitude);
      return {
        sunAltitude: sunPos ? sunPos.altitude * 180 / Math.PI : null,
        moonAltitude: moonPos ? moonPos.altitude * 180 / Math.PI : null
      };
    }

    function clamp(value, min, max) { return Math.min(max, Math.max(min, value)); }
    function normalizeHours(hours) { let value = hours % 24; if (value < 0) value += 24; return value; }
    function julianDate(date) { return date.getTime() / 86400000 + 2440587.5; }
    function localSiderealTimeHours(date, longitude) {
      const jd = julianDate(date);
      const d = jd - 2451545.0;
      const gmst = 18.697374558 + 24.06570982441908 * d;
      return normalizeHours(gmst + longitude / 15);
    }
    function radians(deg) { return (deg * Math.PI) / 180; }

    function altitudeDegrees(date, latitude, longitude, raHours, decDegrees) {
      const lst = localSiderealTimeHours(date, longitude);
      const hourAngleHours = normalizeHours(lst - raHours);
      const hourAngle = radians(hourAngleHours * 15);
      const lat = radians(latitude);
      const dec = radians(decDegrees);
      const altitude = Math.asin(Math.sin(lat) * Math.sin(dec) + Math.cos(lat) * Math.cos(dec) * Math.cos(hourAngle));
      return altitude * 180 / Math.PI;
    }

    function getProminentConstellation(date, latitude, longitude, isNight) {
      if (!isNight) return null;
      let best = null;
      for (const item of prominentConstellations) {
        const altitude = altitudeDegrees(date, latitude, longitude, item.ra, item.dec);
        if (altitude < 8) continue;
        const score = altitude + (item.dec > 0 ? 2 : 0);
        if (!best || score > best.score) best = { ...item, altitude, score };
      }
      return best;
    }

    function renderConstellation(constellation, visible) {
      constellationLayer.innerHTML = '';
      constellationLayer.style.opacity = visible && constellation ? '1' : '0';
      if (!visible || !constellation) return;
      const anchorX = 58, anchorY = 34, scale = 1.2;
      const points = constellation.stars.map((star) => ({ x: anchorX + (star.x - 50) * scale, y: anchorY + (star.y - 40) * scale }));
      for (const point of points) {
        const starEl = document.createElement('div');
        starEl.className = 'constellation-star';
        starEl.style.left = `${point.x}%`;
        starEl.style.top = `${point.y}%`;
        constellationLayer.appendChild(starEl);
      }
    }

    function getSceneFromWeather(current, sunriseDate, sunsetDate) {
      const currentTime = asDate(current.time);
      const weatherCode = current.weather_code;
      const precipitation = current.precipitation || 0;
      const snowfall = current.snowfall || 0;
      const showers = current.showers || 0;
      if ([71,73,75,77,85,86].includes(weatherCode) || snowfall > 0) return 'snow';
      if ([51,53,55,61,63,65,80,81,82].includes(weatherCode) || (precipitation > 0.2 && snowfall <= 0 && showers >= 0)) return 'rain';
      if (!current.is_day) return 'night';
      if (!(sunriseDate instanceof Date) || Number.isNaN(sunriseDate.getTime()) || !(sunsetDate instanceof Date) || Number.isNaN(sunsetDate.getTime())) return current.is_day ? 'day' : 'night';
      const dawnEnd = sunriseDate.getTime() + 90 * 60 * 1000;
      const duskStart = sunsetDate.getTime() - 90 * 60 * 1000;
      if (currentTime.getTime() <= dawnEnd) return 'dawn';
      if (currentTime.getTime() >= duskStart) return 'dusk';
      return 'day';
    }

    function getSkyPalette(scene, cloudCover = 0) {
      const cloudFactor = clamp(cloudCover / 100, 0, 1);
      const palettes = {
        dawn: { bodyTop: '#cedfeb', bodyBottom: '#f2d9bb', skyTop: '#bcd7e6', skyBottom: '#f4cda8', sunOpacity: 1, moonOpacity: 0.2, stars: 0.08, birds: 0.55, sunPath: 0.16, moonPath: 0.86 },
        day: { bodyTop: '#d7ebf7', bodyBottom: '#f3e3c7', skyTop: '#c4e0ef', skyBottom: '#f5dfbf', sunOpacity: 1, moonOpacity: 0.04, stars: 0, birds: 1, sunPath: 0.5, moonPath: 0.96 },
        dusk: { bodyTop: '#7f97bc', bodyBottom: '#ebb88c', skyTop: '#809ec4', skyBottom: '#eda96e', sunOpacity: 0.9, moonOpacity: 0.24, stars: 0.18, birds: 0.35, sunPath: 0.84, moonPath: 0.14 },
        night: { bodyTop: '#152235', bodyBottom: '#314564', skyTop: '#1c2940', skyBottom: '#374e73', sunOpacity: 0.03, moonOpacity: 1, stars: 1, birds: 0, sunPath: 1.06, moonPath: 0.52 },
        rain: { bodyTop: '#8898a9', bodyBottom: '#c8c0b7', skyTop: '#91a3b4', skyBottom: '#cfc8bf', sunOpacity: 0.12, moonOpacity: 0.08, stars: 0, birds: 0, sunPath: 0.48, moonPath: 0.82 },
        snow: { bodyTop: '#cfdce8', bodyBottom: '#eef3f8', skyTop: '#c7d6e3', skyBottom: '#f4f7fb', sunOpacity: 0.14, moonOpacity: 0.1, stars: 0, birds: 0, sunPath: 0.44, moonPath: 0.78 }
      };
      const palette = palettes[scene];
      const extraCloud = scene === 'rain' ? 0.18 : 0;
      return {
        ...palette,
        clouds: clamp(0.3 + cloudFactor * 0.7 + extraCloud, 0.2, 1),
        rain: scene === 'rain' ? 1 : 0,
        snow: scene === 'snow' ? 1 : 0
      };
    }

    function applyScene(scene, current, sunriseDate, sunsetDate) {
      const palette = getSkyPalette(scene, current.cloud_cover || 0);
      document.body.style.setProperty('--sky-top', palette.bodyTop);
      document.body.style.setProperty('--sky-bottom', palette.bodyBottom);
      document.documentElement.style.setProperty('--sky-top', palette.skyTop);
      document.documentElement.style.setProperty('--sky-bottom', palette.skyBottom);

      const now = asDate(current.time);
      const daylightTotal = (sunriseDate instanceof Date && sunsetDate instanceof Date && !Number.isNaN(sunriseDate.getTime()) && !Number.isNaN(sunsetDate.getTime()))
        ? Math.max(1, sunsetDate.getTime() - sunriseDate.getTime()) : 1;
      const daylightProgress = (sunriseDate instanceof Date && sunsetDate instanceof Date && !Number.isNaN(sunriseDate.getTime()) && !Number.isNaN(sunsetDate.getTime()))
        ? clamp((now.getTime() - sunriseDate.getTime()) / daylightTotal, 0, 1) : palette.sunPath;
      const sunPath = scene === 'night' ? palette.sunPath : daylightProgress;

      const bodyAltitudes = getBodyAltitudes(now, currentLocation.latitude, currentLocation.longitude);
      const sunVisible = typeof bodyAltitudes.sunAltitude === 'number' ? bodyAltitudes.sunAltitude > -0.8 : scene !== 'night';
      const moonVisible = typeof bodyAltitudes.moonAltitude === 'number' ? bodyAltitudes.moonAltitude > -0.8 : scene === 'night';

      const sunLeft = 10 + sunPath * 76;
      const sunTop = 250 - Math.sin(Math.PI * clamp(sunPath, 0, 1)) * 170;
      sun.style.left = `${sunLeft}%`;
      sun.style.top = `${sunTop}px`;
      sun.style.opacity = sunVisible ? palette.sunOpacity : 0;

      const moonSeed = (now.getHours() + now.getMinutes() / 60) / 24;
      const moonPath = scene === 'night' ? moonSeed : palette.moonPath;
      const moonLeft = 12 + moonPath * 72;
      const moonTop = 235 - Math.sin(Math.PI * clamp(moonPath, 0, 1)) * 155;
      moon.style.left = `${moonLeft}%`;
      moon.style.top = `${moonTop}px`;
      let moonOpacity = 0;
      if (moonVisible) moonOpacity = scene === 'night' ? 1 : scene === 'day' ? 0.16 : Math.max(0.28, palette.moonOpacity);
      moon.style.opacity = moonOpacity;
      moon.style.transform = scene === 'night' ? 'scale(1.05)' : 'scale(1)';

      stars.style.opacity = scene === 'night' ? palette.stars : 0;
      skyCard.classList.toggle('night-scene', scene === 'night');
      rain.style.opacity = palette.rain;
      snow.style.opacity = palette.snow;
      birds.style.opacity = palette.birds;
      [...cloudLayer.children].forEach((cloud, index) => {
        const baseOpacity = Math.max(0, palette.clouds - index * 0.14);
        cloud.style.opacity = scene === 'snow' ? Math.max(0, baseOpacity - 0.18) : baseOpacity;
      });
    }

    async function searchLocation(query) {
      const params = new URLSearchParams({ name: query, count: '1', language: LANG, format: 'json' });
      const response = await fetch(`https://geocoding-api.open-meteo.com/v1/search?${params.toString()}`, { headers: { Accept: 'application/json' } });
      if (!response.ok) throw new Error(`Geocoding HTTP ${response.status}`);
      const data = await response.json();
      const result = data.results?.[0];
      if (!result) throw new Error('location_not_found');
      return { name: [result.name, result.admin1, result.country].filter(Boolean).join(', '), latitude: result.latitude, longitude: result.longitude, timezone: result.timezone || 'auto' };
    }

    async function fetchWeather(location) {
      const params = new URLSearchParams({ latitude: String(location.latitude), longitude: String(location.longitude), current: 'temperature_2m,weather_code,cloud_cover,is_day,precipitation,snowfall,showers,wind_speed_10m,wind_gusts_10m', hourly: 'weather_code,precipitation,snowfall,showers', daily: 'sunrise,sunset', timezone: location.timezone || 'auto', timeformat: 'unixtime', forecast_days: '1' });
      const response = await fetch(`https://api.open-meteo.com/v1/forecast?${params.toString()}`, { headers: { Accept: 'application/json' } });
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      return response.json();
    }

    function pickPrompt(promptList, seedParts = []) {
      if (!Array.isArray(promptList) || promptList.length === 0) {
        return LANG === 'en' ? 'Look up for a moment and notice what the sky is doing.' : 'Spójrz przez chwilę w górę i zauważ, co robi niebo.';
      }
      const seed = seedParts.join('|');
      let hash = 0;
      for (let i = 0; i < seed.length; i += 1) {
        hash = ((hash << 5) - hash) + seed.charCodeAt(i);
        hash |= 0;
      }
      const index = Math.abs(hash) % promptList.length;
      return promptList[index];
    }

    function applyWeather(data) {
      const current = data.current;
      if (!current) throw new Error('weather_incomplete');
      lastWeather = data;
      const nearNow = getNearestHourlySample(data, current.time);
      const effectiveCode = nearNow?.weather_code ?? current.weather_code;
      const effectiveCurrent = {
        ...current,
        weather_code: effectiveCode,
        precipitation: Math.max(current.precipitation || 0, nearNow?.precipitation || 0),
        snowfall: Math.max(current.snowfall || 0, nearNow?.snowfall || 0),
        showers: Math.max(current.showers || 0, nearNow?.showers || 0)
      };
      const weatherInfo = weatherCodeMap[effectiveCurrent.weather_code] || {
        label: { pl: 'Warunki zmienne', en: 'Variable conditions' },
        mood: { pl: 'Nieoczywiste', en: 'Uncertain' },
        prompts: {
          pl: ['Zobacz, jaka pogoda naprawdę tu jest.', 'Co w tym momencie jest najbardziej rzeczywiste?', 'Jakie małe odczucie warto dziś zauważyć?'],
          en: ['Notice what the weather is actually doing here.', 'What feels most real in this moment?', 'Which small feeling is worth noticing today?']
        }
      };

      const timezone = data.timezone || currentLocation.timezone || DEFAULT_LOCATION.timezone;
      const currentDate = asDate(current.time);
      const astronomy = getAstronomyForDay(currentDate, currentLocation.latitude, currentLocation.longitude, timezone);
      const sunriseDate = astronomy?.sunrise || (data.daily?.sunrise?.[0] != null ? asDate(data.daily.sunrise[0]) : null);
      const sunsetDate = astronomy?.sunset || (data.daily?.sunset?.[0] != null ? asDate(data.daily.sunset[0]) : null);
      const scene = getSceneFromWeather(effectiveCurrent, sunriseDate, sunsetDate);
      applyScene(scene, effectiveCurrent, sunriseDate, sunsetDate);
      renderConstellation(getProminentConstellation(currentDate, currentLocation.latitude, currentLocation.longitude, scene === 'night'), scene === 'night');

      liveSceneData = { sunriseDate, sunsetDate, timezone, latitude: currentLocation.latitude, longitude: currentLocation.longitude, cloud_cover: effectiveCurrent.cloud_cover || 0, weather_code: effectiveCurrent.weather_code, precipitation: effectiveCurrent.precipitation || 0, snowfall: effectiveCurrent.snowfall || 0, showers: effectiveCurrent.showers || 0 };

      tempEl.textContent = `${Math.round(current.temperature_2m)}°C`;
      stateEl.textContent = weatherInfo.label[LANG] || weatherInfo.label.pl;
      conditionDetailEl.textContent = buildConditionDetail(current, nearNow);
      skyMoodEl.textContent = weatherInfo.mood[LANG] || weatherInfo.mood.pl;
      sunriseTimeEl.textContent = sunriseDate ? formatMoonEvent(sunriseDate, timezone) : '—';
      sunsetTimeEl.textContent = sunsetDate ? formatMoonEvent(sunsetDate, timezone) : '—';
      moonPhaseEl.textContent = astronomy?.moonPhaseValue != null ? moonPhaseFromIllumination(astronomy.moonPhaseValue) : moonPhaseFromDate(currentDate);
      moonriseTimeEl.textContent = astronomy?.moonAlwaysUp ? t('allDay') : astronomy?.moonrise ? formatMoonEvent(astronomy.moonrise, timezone) : t('moonNeverRises');
      moonsetTimeEl.textContent = astronomy?.moonAlwaysDown ? t('moonNeverSets') : astronomy?.moonset ? formatMoonEvent(astronomy.moonset, timezone) : t('moonNeverSets');
      const promptList = weatherInfo.prompts?.[LANG] || weatherInfo.prompts?.pl || [];
      reflectionEl.textContent = pickPrompt(promptList, [effectiveCurrent.weather_code, currentLocation.name, currentDate.toISOString().slice(0, 13)]);
      placeLabelEl.textContent = `${t('placePrefix')} · ${currentLocation.name}`;
      statusNoteEl.textContent = `${t('sourcePrefix')} ${t('sourceValue')} · ${t('lastUpdate')} ${formatTime(current.time, timezone)}`;
      updateClock();
    }

    async function refreshWeather(showLoading = true) {
      try {
        refreshBtn.disabled = true; locateBtn.disabled = true; searchBtn.disabled = true; locationInput.disabled = true;
        if (showLoading) { stateEl.textContent = t('loadingWeather'); statusNoteEl.textContent = t('fetchingLatest'); }
        const data = await fetchWeather(currentLocation);
        if (data.timezone) currentLocation.timezone = data.timezone;
        applyWeather(data);
      } catch (error) {
        console.error(error);
        stateEl.textContent = t('refreshFailed');
        reflectionEl.textContent = t('calmWindow');
        statusNoteEl.textContent = t('weatherConnectionFailed');
        if (!lastWeather) {
          tempEl.textContent = '--°C'; conditionDetailEl.textContent = ''; skyMoodEl.textContent = '--'; sunriseTimeEl.textContent = '--:--'; sunsetTimeEl.textContent = '--:--';
          moonPhaseEl.textContent = moonPhaseFromDate(new Date()); moonriseTimeEl.textContent = '--:--'; moonsetTimeEl.textContent = '--:--';
        }
      } finally {
        refreshBtn.disabled = false; locateBtn.disabled = false; searchBtn.disabled = false; locationInput.disabled = false;
      }
    }

    async function handleLocationSearch(event) {
      event.preventDefault();
      const query = locationInput.value.trim();
      if (!query) { statusNoteEl.textContent = t('typeLocation'); return; }
      try {
        statusNoteEl.textContent = t('searchingPlace');
        searchBtn.disabled = true; locationInput.disabled = true;
        const foundLocation = await searchLocation(query);
        currentLocation = foundLocation;
        locationInput.value = foundLocation.name;
        await refreshWeather(true);
      } catch (error) {
        console.error(error);
        statusNoteEl.textContent = error.message === 'location_not_found' ? t('placeNotFound') : t('searchFailed');
      } finally {
        searchBtn.disabled = false; locationInput.disabled = false;
      }
    }

    function useBrowserLocation() {
      if (!navigator.geolocation) { statusNoteEl.textContent = t('geoUnavailable'); return; }
      statusNoteEl.textContent = t('askGeo');
      navigator.geolocation.getCurrentPosition(async (position) => {
        currentLocation = { name: t('myLocation'), latitude: position.coords.latitude, longitude: position.coords.longitude, timezone: 'auto' };
        await refreshWeather(true);
      }, () => { statusNoteEl.textContent = t('geoFailed'); }, { enableHighAccuracy: false, timeout: 10000, maximumAge: 300000 });
    }

    function runSmokeTests() {
      console.assert(document.querySelector('meta[name="viewport"]') !== null, 'Viewport meta tag should exist');
      console.assert(typeof moonPhaseFromDate === 'function', 'moonPhaseFromDate should be defined');
      console.assert(typeof getAstronomyForDay === 'function', 'getAstronomyForDay should be defined');
      console.assert(asDate(1742000000) instanceof Date, 'asDate should convert unix seconds');
      console.assert(document.getElementById('moonriseTime') !== null, 'Moonrise field should exist');
      console.assert(document.getElementById('moonsetTime') !== null, 'Moonset field should exist');
      console.assert(document.getElementById('labelSunrise') !== null, 'Sunrise label should exist');
      console.assert(document.getElementById('labelMoonset') !== null, 'Moonset label should exist');
      console.assert(document.getElementById('locationInput') !== null, 'Location input should exist');
      console.assert(document.getElementById('searchBtn') !== null, 'Search button should exist');
      console.assert(document.getElementById('snow') !== null, 'Snow layer should exist');
      console.assert(document.getElementById('conditionDetail') !== null, 'Condition detail field should exist');
      console.assert(document.querySelectorAll('.flake').length >= 40, 'Snow scene should have enough flakes');
      console.assert(getSceneFromWeather({ time: Date.now(), weather_code: 85, precipitation: 0, snowfall: 0.2, showers: 0, is_day: 1 }, new Date(Date.now()-3600000), new Date(Date.now()+3600000)) === 'snow', 'Snow showers should trigger snow scene');
      console.assert(typeof pickPrompt === 'function', 'pickPrompt should be defined');
      console.assert(typeof getNearestHourlySample === 'function', 'getNearestHourlySample should be defined');
      const hourlySample = getNearestHourlySample({ hourly: { time: [1742000000,1742003600,1742007200], weather_code: [3,85,3], precipitation: [0,0.4,0], snowfall: [0,0.2,0], showers: [0,0,0] } }, 1742003600);
      console.assert(hourlySample.weather_code === 85 && hourlySample.snowfall >= 0.2, 'Hourly sample should preserve nearby snow');
      console.assert(typeof pickPrompt(['a','b'], ['x']) === 'string', 'pickPrompt should return a string');
    }

    refreshBtn.addEventListener('click', () => refreshWeather(true));
    locateBtn.addEventListener('click', useBrowserLocation);
    locationForm.addEventListener('submit', handleLocationSearch);
    searchBtn.addEventListener('click', (event) => { event.preventDefault(); handleLocationSearch(event); });

    applyStaticText();
    runSmokeTests();
    refreshWeather(true);
    updateLivePositions();
    setInterval(updateLivePositions, 60000);
    setInterval(() => refreshWeather(false), 15 * 60 * 1000);
  </script>

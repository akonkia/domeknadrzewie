<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <script async src="https://www.googletagmanager.com/gtag/js?id=G-3WGXSZG17N"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-3WGXSZG17N');
  </script>
  <script defer src="https://cloud.umami.is/script.js" data-website-id="5c1874f7-4673-4774-8133-2b7f9cb019e0"></script>

  <title>Urban forest bathing| Project: Treehouse</title>
  
  <style>
    :root {
      --sage: #678760;
      --orange: #fb9b27;
      --gold: #fcc15d;
      --cream: #f5f4ef;
      --white: #ffffff;
      --text: #243126;
      --muted: #5e675f;
      --line: rgba(36, 49, 38, 0.1);
      --hero-overlay: rgba(36, 49, 38, 0.4);
      --shadow: 0 16px 34px rgba(32, 42, 33, 0.08);
      --max: 1120px;
      --content: 980px;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      font-family: Inter, Arial, sans-serif;
      color: var(--text);
      background: #f3f1eb;
      line-height: 1.6;
    }

    img { display: block; max-width: 100%; height: auto; }
    a { color: inherit; text-decoration: none; }

    .container { width: min(calc(100% - 32px), var(--max)); margin: 0 auto; }
    .narrow { width: min(calc(100% - 32px), var(--content)); margin: 0 auto; }

    /* Navigation */
    .topbar {
      background: rgba(255,255,255,0.94);
      border-bottom: 1px solid var(--line);
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(10px);
    }
    .nav { min-height: 88px; display: flex; align-items: center; justify-content: space-between; }
    .brand { display: flex; align-items: center; gap: 14px; }
    .brand-mark { width: 50px; height: 50px; border-radius: 50%; overflow: hidden; border: 1px solid var(--line); }
    .nav-links a { padding: 10px 15px; text-transform: uppercase; font-size: 0.8rem; font-weight: 800; }
    .nav-links a.active { color: var(--sage); border-bottom: 2px solid var(--sage); }

    /* Hero */
    .hero { 
      min-height: 300px; display: flex; align-items: center; justify-content: center; text-align: center;
      background: linear-gradient(var(--hero-overlay), var(--hero-overlay)), 
      url('https://cdn.jsdelivr.net/gh/akonkia/domeknadrzewie@main/assets/img/Environmental-Organization-Website-Design-788x871.jpg') center/cover;
      color: white; 
    }
    .hero h1 { font-size: clamp(2rem, 5vw, 3.5rem); text-transform: uppercase; margin: 0; }

    /* Filters */
    .filter-section { background: white; padding: 25px; margin: 30px 0; border: 1px solid var(--line); box-shadow: var(--shadow); }
    .filter-group { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 10px; }
    .filter-label { font-weight: 800; font-size: 0.7rem; text-transform: uppercase; color: var(--sage); min-width: 80px; }
    .filter-btn { padding: 6px 14px; border: 1px solid var(--line); background: transparent; cursor: pointer; border-radius: 20px; font-size: 0.8rem; transition: 0.2s; }
    .filter-btn.active { background: var(--sage); color: white; border-color: var(--sage); }

    /* Cards */
    .material-list { display: grid; gap: 30px; margin-bottom: 50px; }
    .material-item { 
      display: grid; grid-template-columns: 300px 1fr; gap: 30px; 
      padding: 30px; background: white; border: 1px solid var(--line); box-shadow: var(--shadow);
    }
    .material-visual img { border-radius: 8px; box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
    .material-header h3 { font-size: 1.5rem; margin: 0 0 5px 0; text-transform: uppercase; }
    .material-meta { color: var(--muted); font-weight: 700; font-size: 0.85rem; text-transform: uppercase; margin-bottom: 15px; display: block; }
    .material-body { margin-bottom: 20px; }
    .material-reflection { background: var(--cream); padding: 20px; border-radius: 8px; margin-bottom: 20px; }
    .material-reflection strong { display: block; color: var(--sage); text-transform: uppercase; font-size: 0.8rem; margin-bottom: 10px; }
    .material-reflection ul { margin: 0; padding-left: 20px; }

    .download-links { display: flex; gap: 10px; flex-wrap: wrap; }
    .download-links a, .download-links button { 
        padding: 10px 20px; border-radius: 25px; font-weight: 800; font-size: 0.75rem; 
        text-transform: uppercase; transition: 0.2s; border: none; cursor: pointer; display: flex; align-items: center; gap: 5px;
    }
    .btn-main { background: var(--sage); color: white; }
    .btn-alt { background: var(--gold); color: #3d2a10; }
    .btn-copy { background: #e0e7ff; color: #4338ca; }
    .btn-blog { background: #b44f72; color: white; }

    .week-nav-row { display: flex; gap: 10px; margin-top: 25px; border-top: 1px solid var(--line); padding-top: 20px; }
    .nav-arrow-btn { flex: 1; padding: 12px; cursor: pointer; border: 1px solid var(--line); background: white; font-weight: 800; text-transform: uppercase; font-size: 0.7rem; transition: 0.2s; }
    .nav-arrow-btn:hover { border-color: var(--sage); color: var(--sage); }
    .nav-arrow-btn.disabled { visibility: hidden; }

    @media (max-width: 850px) {
      .material-item { grid-template-columns: 1fr; }
      .material-visual { max-width: 300px; margin: 0 auto; }
    }
  </style>
</head>
<body>

  <header class="topbar">
    <div class="container nav">
      <a class="brand" href="/">
        <div class="brand-mark"><img src="https://cdn.jsdelivr.net/gh/akonkia/domeknadrzewie@main/assets/img/logo.png" alt="Logo" /></div>
        <div style="margin-left:10px"><strong>Project: Treehouse</strong></div>
      </a>
      <nav class="nav-links">
        <a href="/">About</a>
        <a href="#" class="active">Materials</a>
      </nav>
    </div>
  </header>

  <section class="hero">
    <h1>Urban forest bathing</h1>
  </section>

  <main class="narrow">
    <nav class="filter-section">
      <div class="filter-group">
        <span class="filter-label">Season:</span>
        <button class="filter-btn active" data-type="season" data-val="All" onclick="applyFilter(this)">All</button>
        <button class="filter-btn" data-type="season" data-val="Winter" onclick="applyFilter(this)">Winter</button>
        <button class="filter-btn" data-type="season" data-val="Spring" onclick="applyFilter(this)">Spring</button>
      </div>
      <div class="filter-group">
        <span class="filter-label">Month:</span>
        <button class="filter-btn" data-type="month" data-val="January" onclick="applyFilter(this)">January</button>
        <button class="filter-btn" data-type="month" data-val="February" onclick="applyFilter(this)">February</button>
        <button class="filter-btn" data-type="month" data-val="March" onclick="applyFilter(this)">March</button>
        <button class="filter-btn" data-type="month" data-val="April" onclick="applyFilter(this)">April</button>
      </div>
    </nav>

    <section id="materialList" class="material-list"></section>
  </main>

  <script>
    const cardsData = [
{ id: 1, title: "Silent Root", theme: "Stillness", season: "Winter", month: "January", body: "Enter a green space slowly. Pause often. Sit or stand still for five minutes.", reflection: ["What sounds remain when everything grows quiet?", "Where in my body do I feel stillness?"], img: "miejskie-kapiele-lesne-zima-styczen-01-cichy-korzen-A.png", imgB: "1Ben.png", blog: "DT_RCYoDvNk" },

{ id: 2, title: "Hidden Strength", theme: "Endurance", season: "Winter", month: "January", body: "Look for signs of endurance — evergreen needles, moss, lichen, tightly closed buds. Touch them gently.", reflection: ["Who or what has helped me through difficult seasons?", "In what situations do I feel a sense of inner calm?"], img: "miejskie-kapiele-lesne-zima-styczen-02-ukryta-sila-A.png", imgB: "2Ben.png", blog: "DUEAsDsjI_j" },

{ id: 3, title: "Unhurried Path", theme: "Slowness", season: "Winter", month: "January", body: "Walk at half your usual pace. Let your breath set the rhythm. With each step, fully feel the ground beneath you.", reflection: ["What do I begin to notice only when I am not rushing anywhere?", "Where in my life am I moving forward without need?"], img: "miejskie-kapiele-lesne-zima-styczen-03-niespieszna-sciezka-A.png", imgB: "3Ben.png", blog: "DUV2YvGDUgG" },

{ id: 4, title: "Light That Reaches Us", theme: "Awakening", season: "Winter", month: "January", body: "Raise your hand toward the light. Let its warmth rest on your clothes, your skin, and gently illuminate a quiet space within you.", reflection: ["Which part of me is ready to reach for something new?", "What warms me from within?"], img: "miejskie-kapiele-lesne-zima-styczen-04-zimowe-swiatlo-A.png", imgB: "4Ben.png", blog: "DUn-M6TDKpW" },

{ id: 5, title: "Winter Breath", theme: "Rest", season: "Winter", month: "February", body: "Sit by a window or outside. Observe the softness of each breath.", reflection: ["What might it mean to rest without guilt?", "Which thoughts keep circling, and which can I let go of now?"], img: "miejskie-kapiele-lesne-zima-luty-05-zimowy-oddech-A.png", imgB: "5Ben.png", blog: "DU6D4A6jk5L" },

{ id: 6, title: "Hidden Spark", theme: "Subtle Energy", season: "Winter", month: "February", body: "Look for small places where warmth gathers. It might be a ray of sunlight on a wall, or a scarf warmed by your breath.", reflection: ["What warmth do I carry within me?", "Where in my life is something beginning?"], img: "miejskie-kapiele-lesne-zima-luty-06-ukryta-iskra-A.png", imgB: "6Ben.png", blog: "DVMH6kOjGq_" },

{ id: 7, title: "Frosted Bud", theme: "Potential", season: "Winter", month: "February", body: "Find a shrub or tree and look closely at its buds — small promises waiting for the right moment.", reflection: ["What is quietly maturing within me?", "What is the smallest sign that something is beginning?"], img: "miejskie-kapiele-lesne-zima-luty-07-oszroniony-pak-A.png", imgB: "7Ben.png", blog: "DVeJb09jrR4" },

{ id: 8, title: "First Chorus", theme: "Awakening", season: "Winter", month: "February", body: "Step outside for 2–3 minutes and listen. Notice how it was quiet for so long, and now birdsong begins to stand out. First focus on a single voice, then expand your attention to the whole chorus.", reflection: ["What do I feel when silence breaks — relief, warmth, tension, calm?", "What ‘first notes’ are returning to my life after a period of quiet?"], img: "miejskie-kapiele-lesne-zima-luty-08-pierwszy-chor-A.png", imgB: "8Ben.png", blog: "DVwK83jDq6L" },

{ id: 9, title: "Evergreen", theme: "Steadiness", season: "Winter", month: "March", body: "Spend a moment with an evergreen tree. Breathe with it in rhythm: 4 seconds inhale, 6 seconds exhale.", reflection: ["What small things regularly calm and sustain me?"], img: "miejskie-kapiele-lesne-zima-marzec-09-zimozielony-A.png", imgB: "9Ben.png", blog: "DWCI7kKDHlM" },

{ id: 10, title: "Thaw", theme: "Softening", season: "Spring", month: "March", body: "Step outside and look for signs of thaw: small puddles, darkening bark, the quiet sheen of wet earth.", reflection: ["Where in my life can I safely soften a little?", "What changes when I allow this moment to be exactly as it is, without holding on or resisting?"], img: "miejskie-kapiele-lesne-wiosna-marzec-10-odwilz-A.png", imgB: "10Ben.png", blog: "DWUK6lDjNqX" },

{ id: 11, title: "Earth Awakening", theme: "Renewal", season: "Spring", month: "March", body: "Step outside and pause for a moment. Listen to the quiet signals of returning life: birdsong, distant calls, gentle movement in branches. Notice what is just beginning to emerge.", reflection: ["What sounds signal renewal to me?", "What is beginning to take root in my life, slowly but surely?", "Can I allow this process to unfold at its own pace?"], img: "miejskie-kapiele-lesne-wiosna-marzec-11-przebudzenie-ziemi-A.png", imgB: "11Ben.png", blog: "DWmN1KkDhq_" },

{ id: 12, title: "Morning Whispers", theme: "Small Wonders", season: "Spring", month: "March", body: "Spend a few minutes each morning sitting by a window or beneath a tree. Close your eyes, breathe gently, and let your attention follow the sounds of early spring — birdsong, rustling branches, the subtle pulse of awakening life. Notice which of them bring you calm, curiosity, or lightness.", reflection: ["Which small joys speak to me most right now?", "How do these subtle moments shape my mood or the way I enter the day?", "Where else during the day can I pause to hear this quiet music around me?"], img: "wiosna-marzec-tydzien-12-poranne-szepty-wiosenne-paki-niebo-12A.png", imgB: "spring-march-week-12-tiny-wonders-spring-buds-sky-12Ben.png", blog: "DWszgyEjOc_" },
      { 
  id: 13,
  title: "Quiet Return",
  theme: "Continuity",
  season: "Spring",
  month: "March",
  body: "Visit a place you haven’t returned to since winter began. Pause before entering. Notice your breath. Then step in slowly, letting the place meet you as you are now.",
  reflection: [
    "What has changed?",
    "What has remained quietly the same?",
    "What in you also feels like a return?"
  ],
  img: "marzec-wiosna-tydzien-13-cwiczenie-uwaznosci-powrot-do-miejsca-13A.png",
  imgB: "march-spring-week-13-mindfulness-exercise-returning-to-a-place-13Ben.png",
  blog: "2026/04/08/quiet-return-exercise-mindfulness-for-spring"
},
      { 
  id: 14,
  title: "The Open Blossom",
  theme: "Opening",
  season: "Spring",
  month: "April",
  body: "Find a blossom or a leaf that is opening. Notice its shape, edges, and color. Notice what is changing.",
  reflection: [
    "Find one thing you want to be more open to. What is it?",
    "Think of something you’ve been holding back from. How close are you to it?",
    "Where might it be right to stay closed?"
  ],
  img: "wiosna-kwiecien-tydzien-14-cwiczenie-uwaznosci-otwierajacy-sie-kwiat-14A.png",
  imgB: "spring-april-week-13-mindfulness-exercise-opening-blossom-14Ben.png",
  blog: "2026/04/10/opening-step-by-step-mindfulness-exercise-inspired-by-nature.en"
}
      
];

    const listElement = document.getElementById('materialList');
    const imgPath = "https://cdn.jsdelivr.net/gh/akonkia/domeknadrzewie@main/materialy/kapiele_miejskie/";

    function render(data, isSingleView = false) {
      if (!data.length) { listElement.innerHTML = "<p>Brak kart.</p>"; return; }
      
      const firstId = 1;
      const lastId = Math.max(...cardsData.map(c => c.id));

      listElement.innerHTML = data.map(card => `
        <article class="material-item">
          <div class="material-visual"><img src="${imgPath}${card.img}?v=2026" alt="${card.title}"></div>
          <div class="material-content">
            <header>
              <span class="material-meta">${card.season} • ${card.month} • ${card.theme}</span>
              <h3>Week ${card.id.toString().padStart(2, '0')} - ${card.title}</h3>
            </header>
            <div class="material-body">${card.body}</div>
            <div class="material-reflection">
              <strong>Refleksja:</strong>
              <ul>${card.reflection.map(q => `<li>${q}</li>`).join('')}</ul>
            </div>
            <div class="download-links">
              <a href="${imgPath}${card.img}?v=2026" download class="btn-main">Image</a>
              <a href="${imgPath}${card.imgB}?v=2026" download class="btn-alt">Reflection</a>
              <button onclick="copyLink(${card.id})" class="btn-copy">🔗 Copy link</button>
              <a href="https://domeknadrzewie.edu.pl/blog/${card.blog}/" target="_blank" class="btn-blog">Blog</a>
          
            </div>
            ${isSingleView ? `
            <div class="week-nav-row">
              <button class="nav-arrow-btn ${card.id <= firstId ? 'disabled' : ''}" onclick="showSpecificWeek(${card.id - 1})">← Poprzedni</button>
              <button class="nav-arrow-btn ${card.id >= lastId ? 'disabled' : ''}" onclick="showSpecificWeek(${card.id + 1})">Następny →</button>
            </div>` : ''}
          </div>
        </article>
      `).join('');
    }

    function copyLink(id) {
      const url = window.location.origin + window.location.pathname + '#tydzien-' + id;
      navigator.clipboard.writeText(url).then(() => {
        const btn = event.currentTarget;
        const originalText = btn.innerHTML;
        btn.innerHTML = "✅ Copied!";
        setTimeout(() => { btn.innerHTML = originalText; }, 2000);
      });
    }

    function applyFilter(btn) {
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      const type = btn.getAttribute('data-type');
      const val = btn.getAttribute('data-val');
      
      const filtered = val === 'All' ? cardsData : cardsData.filter(c => c[type] === val);
      
      if (type === 'month') {
        render([filtered[0]], true);
      } else {
        const sorted = [...filtered].sort((a,b) => b.id - a.id);
        render(sorted, false);
      }
    }

    function showSpecificWeek(id) {
      const card = cardsData.find(c => c.id === id);
      if (card) {
        window.location.hash = 'tydzien-' + id;
        render([card], true);
        window.scrollTo({top: listElement.offsetTop - 100, behavior: 'smooth'});
      }
    }

    function handleRouting() {
      const hash = window.location.hash;
      if (hash && hash.startsWith('#tydzien-')) {
        const id = parseInt(hash.replace('#tydzien-', ''));
        if (!isNaN(id)) {
          showSpecificWeek(id);
          return true;
        }
      }
      return false;
    }

    window.addEventListener('hashchange', handleRouting);
    window.addEventListener('DOMContentLoaded', () => {
      if (!handleRouting()) {
        const latest = [...cardsData].sort((a,b) => b.id - a.id)[0];
        render([latest], true);
      }
    });
  </script>
</body>
</html>

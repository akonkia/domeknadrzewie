<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script defer src="https://cloud.umami.is/script.js" data-website-id="5c1874f7-4673-4774-8133-2b7f9cb019e0"></script>
  <script>
    (function () {
      const script = document.createElement("script");
      script.src = "/assets/js/cards-data.js?v=" + Date.now();
      script.async = false;
      document.head.appendChild(script);
    })();
  </script>

  <title>Urban forest bathing| Project: Treehouse</title>
  
  <style>
    :root {
      --sage: #678760;
      --orange: #fb9b27;
      --gold: #fcc15d;
      --cream: #f5f4ef;
      --white: #ffffff;
      --text: #243126;
      --muted: #5e675f;
      --line: rgba(36, 49, 38, 0.1);
      --hero-overlay: rgba(36, 49, 38, 0.4);
      --shadow: 0 16px 34px rgba(32, 42, 33, 0.08);
      --max: 1120px;
      --content: 980px;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      font-family: Inter, Arial, sans-serif;
      color: var(--text);
      background: #f3f1eb;
      line-height: 1.6;
    }

    img { display: block; max-width: 100%; height: auto; }
    a { color: inherit; text-decoration: none; }

    .container { width: min(calc(100% - 32px), var(--max)); margin: 0 auto; }
    .narrow { width: min(calc(100% - 32px), var(--content)); margin: 0 auto; }

    /* Navigation */
    .topbar {
      background: rgba(255,255,255,0.94);
      border-bottom: 1px solid var(--line);
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(10px);
    }
    .nav { min-height: 88px; display: flex; align-items: center; justify-content: space-between; }
    .brand { display: flex; align-items: center; gap: 14px; }
    .brand-mark { width: 50px; height: 50px; border-radius: 50%; overflow: hidden; border: 1px solid var(--line); }
    .nav-links a { padding: 10px 15px; text-transform: uppercase; font-size: 0.8rem; font-weight: 800; }
    .nav-links a.active { color: var(--sage); border-bottom: 2px solid var(--sage); }

    /* Hero */
    .hero { 
      min-height: 300px; display: flex; align-items: center; justify-content: center; text-align: center;
      background: linear-gradient(var(--hero-overlay), var(--hero-overlay)), 
      url('https://cdn.jsdelivr.net/gh/akonkia/domeknadrzewie@main/assets/img/Environmental-Organization-Website-Design-788x871.jpg') center/cover;
      color: white; 
    }
    .hero h1 { font-size: clamp(2rem, 5vw, 3.5rem); text-transform: uppercase; margin: 0; }

    .breadcrumbs {
      margin: 24px auto 0;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      color: var(--muted);
      font-size: 0.9rem;
    }
    .breadcrumbs a {
      color: var(--muted);
      transition: color 0.2s;
    }
    .breadcrumbs a:hover {
      color: var(--sage);
    }
    .breadcrumbs .separator {
      color: rgba(36, 49, 38, 0.35);
    }
    .breadcrumbs .current {
      color: var(--text);
      font-weight: 700;
    }

    /* Filters */
    .filter-section { background: white; padding: 25px; margin: 30px 0; border: 1px solid var(--line); box-shadow: var(--shadow); }
    .filter-group { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 10px; }
    .filter-label { font-weight: 800; font-size: 0.7rem; text-transform: uppercase; color: var(--sage); min-width: 80px; }
    .filter-btn { padding: 6px 14px; border: 1px solid var(--line); background: transparent; cursor: pointer; border-radius: 20px; font-size: 0.8rem; transition: 0.2s; }
    .filter-btn.active { background: var(--sage); color: white; border-color: var(--sage); }

    /* Cards */
    .material-list { display: grid; gap: 30px; margin-bottom: 50px; }
    .material-item { 
      display: grid; grid-template-columns: 300px 1fr; gap: 30px; 
      padding: 30px; background: white; border: 1px solid var(--line); box-shadow: var(--shadow);
    }
    .material-visual img { border-radius: 8px; box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
    .material-header h3 { font-size: 1.5rem; margin: 0 0 5px 0; text-transform: uppercase; }
    .material-meta { color: var(--muted); font-weight: 700; font-size: 0.85rem; text-transform: uppercase; margin-bottom: 15px; display: block; }
    .material-body { margin-bottom: 20px; }
    .material-reflection { background: var(--cream); padding: 20px; border-radius: 8px; margin-bottom: 20px; }
    .material-reflection strong { display: block; color: var(--sage); text-transform: uppercase; font-size: 0.8rem; margin-bottom: 10px; }
    .material-reflection ul { margin: 0; padding-left: 20px; }

    .download-links { display: flex; gap: 10px; flex-wrap: wrap; }
    .download-links a, .download-links button { 
        padding: 10px 20px; border-radius: 25px; font-weight: 800; font-size: 0.75rem; 
        text-transform: uppercase; transition: 0.2s; border: none; cursor: pointer; display: flex; align-items: center; gap: 5px;
    }
    .btn-main { background: var(--sage); color: white; }
    .btn-alt { background: var(--gold); color: #3d2a10; }
    .btn-copy { background: #e0e7ff; color: #4338ca; }
    .btn-blog { background: #b44f72; color: white; }

    .week-nav-row { display: flex; gap: 10px; margin-top: 25px; border-top: 1px solid var(--line); padding-top: 20px; }
    .nav-arrow-btn { flex: 1; padding: 12px; cursor: pointer; border: 1px solid var(--line); background: white; font-weight: 800; text-transform: uppercase; font-size: 0.7rem; transition: 0.2s; }
    .nav-arrow-btn:hover { border-color: var(--sage); color: var(--sage); }
    .nav-arrow-btn.disabled { visibility: hidden; }

    @media (max-width: 850px) {
      .material-item { grid-template-columns: 1fr; }
      .material-visual { max-width: 300px; margin: 0 auto; }
    }
  </style>
</head>
<body>

  <header class="topbar">
    <div class="container nav">
      <a class="brand" href="/en/">
        <div class="brand-mark"><img src="https://cdn.jsdelivr.net/gh/akonkia/domeknadrzewie@main/assets/img/logo.png" alt="Logo" /></div>
        <div style="margin-left:10px"><strong>Project: Treehouse</strong></div>
      </a>
      <nav class="nav-links">
        <a href="/en/">Start Here</a>
        <a href="/en/materials/" class="active">Materials</a>
        <a href="/blog/en/">Blog</a>
        <a href="/materialy/kapiele_miejskie/" lang="pl" hreflang="pl">Polski</a>
        <a href="/en/about.html">About us</a>
      </nav>
    </div>
  </header>

  <section class="hero">
    <h1>Urban forest bathing</h1>
  </section>

  <div class="narrow">
    <nav class="breadcrumbs" aria-label="Breadcrumbs">
      <a href="/en/materials/">Materials</a>
      <span class="separator">/</span>
      <span class="current">Urban forest bathing</span>
    </nav>
  </div>

  <main class="narrow">
    <section class="filter-section" style="margin-bottom: 0;">
      <div class="filter-group" style="justify-content: space-between;">
        <div>
          <span class="filter-label">Framework:</span>
          <strong>52 weeks grouped into seasonal clusters</strong>
        </div>
        <div class="download-links">
          <a href="/en/materials/urban-bathing/52-week-pattern.html" class="btn-main">View the 52-week pattern</a>
        </div>
      </div>
    </section>

    <nav class="filter-section">
      <div class="filter-group">
        <span class="filter-label">Season:</span>
        <button class="filter-btn active" data-type="season" data-val="All" onclick="applyFilter(this)">All</button>
        <button class="filter-btn" data-type="season" data-val="Winter" onclick="applyFilter(this)">Winter</button>
        <button class="filter-btn" data-type="season" data-val="Spring" onclick="applyFilter(this)">Spring</button>
      </div>
      <div class="filter-group">
        <span class="filter-label">Month:</span>
        <button class="filter-btn" data-type="month" data-val="January" onclick="applyFilter(this)">January</button>
        <button class="filter-btn" data-type="month" data-val="February" onclick="applyFilter(this)">February</button>
        <button class="filter-btn" data-type="month" data-val="March" onclick="applyFilter(this)">March</button>
        <button class="filter-btn" data-type="month" data-val="April" onclick="applyFilter(this)">April</button>
      </div>
    </nav>

    <section id="materialList" class="material-list"></section>
  </main>

  <script>
    const cardsData = typeof window.getWeeklyCardsForLang === 'function'
      ? window.getWeeklyCardsForLang('en')
      : [];

    const listElement = document.getElementById('materialList');
    const imgPath = "https://cdn.jsdelivr.net/gh/akonkia/domeknadrzewie@main/materialy/kapiele_miejskie/";

    function getBlogUrl(card) {
      if (!card.blog) return "#";
      if (card.blog.includes("/")) {
        return `https://domeknadrzewie.edu.pl/${card.blog.replace(/^\/+|\/+$/g, "")}/`;
      }
      return `https://domeknadrzewie.edu.pl/blog/${card.blog}/`;
    }

    function render(data, isSingleView = false) {
      if (!data.length) { listElement.innerHTML = "<p>Brak kart.</p>"; return; }
      
      const firstId = 1;
      const lastId = Math.max(...cardsData.map(c => c.id));

      listElement.innerHTML = data.map(card => `
        <article class="material-item">
          <div class="material-visual"><img src="${imgPath}${card.img}?v=2026" alt="${card.title}"></div>
          <div class="material-content">
            <header>
              <span class="material-meta">${card.season} • ${card.month} • ${card.theme}</span>
              <h3>Week ${card.id.toString().padStart(2, '0')} - ${card.title}</h3>
            </header>
            <div class="material-body">${card.body}</div>
            <div class="material-reflection">
              <strong>Refleksja:</strong>
              <ul>${card.reflection.map(q => `<li>${q}</li>`).join('')}</ul>
            </div>
            <div class="download-links">
              <a href="${imgPath}${card.img}?v=2026" download class="btn-main">Image</a>
              <a href="${imgPath}${card.imgB}?v=2026" download class="btn-alt">Reflection</a>
              <button onclick="copyLink(${card.id})" class="btn-copy">🔗 Copy link</button>
              <a href="${getBlogUrl(card)}" target="_blank" class="btn-blog">Blog</a>
          
            </div>
            ${isSingleView ? `
            <div class="week-nav-row">
              <button class="nav-arrow-btn ${card.id <= firstId ? 'disabled' : ''}" onclick="showSpecificWeek(${card.id - 1})">← Poprzedni</button>
              <button class="nav-arrow-btn ${card.id >= lastId ? 'disabled' : ''}" onclick="showSpecificWeek(${card.id + 1})">Następny →</button>
            </div>` : ''}
          </div>
        </article>
      `).join('');
    }

    function copyLink(id) {
      const url = window.location.origin + window.location.pathname + '#tydzien-' + id;
      navigator.clipboard.writeText(url).then(() => {
        const btn = event.currentTarget;
        const originalText = btn.innerHTML;
        btn.innerHTML = "✅ Copied!";
        setTimeout(() => { btn.innerHTML = originalText; }, 2000);
      });
    }

    function applyFilter(btn) {
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      const type = btn.getAttribute('data-type');
      const val = btn.getAttribute('data-val');
      
      const filtered = val === 'All' ? cardsData : cardsData.filter(c => c[type] === val);
      
      if (type === 'month') {
        render([filtered[0]], true);
      } else {
        const sorted = [...filtered].sort((a,b) => b.id - a.id);
        render(sorted, false);
      }
    }

    function showSpecificWeek(id) {
      const card = cardsData.find(c => c.id === id);
      if (card) {
        window.location.hash = 'tydzien-' + id;
        render([card], true);
        window.scrollTo({top: listElement.offsetTop - 100, behavior: 'smooth'});
      }
    }

    function handleRouting() {
      const hash = window.location.hash;
      if (hash && hash.startsWith('#tydzien-')) {
        const id = parseInt(hash.replace('#tydzien-', ''));
        if (!isNaN(id)) {
          showSpecificWeek(id);
          return true;
        }
      }
      return false;
    }

    window.addEventListener('hashchange', handleRouting);
    window.addEventListener('DOMContentLoaded', () => {
      if (!handleRouting()) {
        const latest = [...cardsData].sort((a,b) => b.id - a.id)[0];
        render([latest], true);
      }
    });
  </script>
</body>
</html>

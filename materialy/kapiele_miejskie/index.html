<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script defer src="https://cloud.umami.is/script.js" data-website-id="5c1874f7-4673-4774-8133-2b7f9cb019e0"></script>

  <title>Miejskie kąpiele leśne | Projekt: Domek na Drzewie</title>
  
  <style>
    :root {
      --sage: #678760;
      --orange: #fb9b27;
      --gold: #fcc15d;
      --cream: #f5f4ef;
      --white: #ffffff;
      --text: #243126;
      --muted: #5e675f;
      --line: rgba(36, 49, 38, 0.1);
      --hero-overlay: rgba(36, 49, 38, 0.4);
      --shadow: 0 16px 34px rgba(32, 42, 33, 0.08);
      --max: 1120px;
      --content: 980px;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      font-family: Inter, Arial, sans-serif;
      color: var(--text);
      background: #f3f1eb;
      line-height: 1.6;
    }

    img { display: block; max-width: 100%; height: auto; }
    a { color: inherit; text-decoration: none; }

    .container { width: min(calc(100% - 32px), var(--max)); margin: 0 auto; }
    .narrow { width: min(calc(100% - 32px), var(--content)); margin: 0 auto; }

    /* Navigation */
    .topbar {
      background: rgba(255,255,255,0.94);
      border-bottom: 1px solid var(--line);
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(10px);
    }
    .nav { min-height: 88px; display: flex; align-items: center; justify-content: space-between; }
    .brand { display: flex; align-items: center; gap: 14px; }
    .brand-mark { width: 50px; height: 50px; border-radius: 50%; overflow: hidden; border: 1px solid var(--line); }
    .nav-links a { padding: 10px 15px; text-transform: uppercase; font-size: 0.8rem; font-weight: 800; }
    .nav-links a.active { color: var(--sage); border-bottom: 2px solid var(--sage); }

    /* Hero */
    .hero { 
      min-height: 300px; display: flex; align-items: center; justify-content: center; text-align: center;
      background: linear-gradient(var(--hero-overlay), var(--hero-overlay)), 
      url('https://cdn.jsdelivr.net/gh/akonkia/domeknadrzewie@main/assets/img/Environmental-Organization-Website-Design-788x871.jpg') center/cover;
      color: white; 
    }
    .hero h1 { font-size: clamp(2rem, 5vw, 3.5rem); text-transform: uppercase; margin: 0; }

    /* Filters */
    .filter-section { background: white; padding: 25px; margin: 30px 0; border: 1px solid var(--line); box-shadow: var(--shadow); }
    .filter-group { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 10px; }
    .filter-label { font-weight: 800; font-size: 0.7rem; text-transform: uppercase; color: var(--sage); min-width: 80px; }
    .filter-btn { padding: 6px 14px; border: 1px solid var(--line); background: transparent; cursor: pointer; border-radius: 20px; font-size: 0.8rem; transition: 0.2s; }
    .filter-btn.active { background: var(--sage); color: white; border-color: var(--sage); }

    /* Cards */
    .material-list { display: grid; gap: 30px; margin-bottom: 50px; }
    .material-item { 
      display: grid; grid-template-columns: 300px 1fr; gap: 30px; 
      padding: 30px; background: white; border: 1px solid var(--line); box-shadow: var(--shadow);
    }
    .material-visual img { border-radius: 8px; box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
    .material-header h3 { font-size: 1.5rem; margin: 0 0 5px 0; text-transform: uppercase; }
    .material-meta { color: var(--muted); font-weight: 700; font-size: 0.85rem; text-transform: uppercase; margin-bottom: 15px; display: block; }
    .material-body { margin-bottom: 20px; }
    .material-reflection { background: var(--cream); padding: 20px; border-radius: 8px; margin-bottom: 20px; }
    .material-reflection strong { display: block; color: var(--sage); text-transform: uppercase; font-size: 0.8rem; margin-bottom: 10px; }
    .material-reflection ul { margin: 0; padding-left: 20px; }

    .download-links { display: flex; gap: 10px; flex-wrap: wrap; }
    .download-links a, .download-links button { 
        padding: 10px 20px; border-radius: 25px; font-weight: 800; font-size: 0.75rem; 
        text-transform: uppercase; transition: 0.2s; border: none; cursor: pointer; display: flex; align-items: center; gap: 5px;
    }
    .btn-main { background: var(--sage); color: white; }
    .btn-alt { background: var(--gold); color: #3d2a10; }
    .btn-copy { background: #e0e7ff; color: #4338ca; }
    .btn-blog { background: #b44f72; color: white; }
  

    .week-nav-row { display: flex; gap: 10px; margin-top: 25px; border-top: 1px solid var(--line); padding-top: 20px; }
    .nav-arrow-btn { flex: 1; padding: 12px; cursor: pointer; border: 1px solid var(--line); background: white; font-weight: 800; text-transform: uppercase; font-size: 0.7rem; transition: 0.2s; }
    .nav-arrow-btn:hover { border-color: var(--sage); color: var(--sage); }
    .nav-arrow-btn.disabled { visibility: hidden; }

    @media (max-width: 850px) {
      .material-item { grid-template-columns: 1fr; }
      .material-visual { max-width: 300px; margin: 0 auto; }
    }
  </style>
</head>
<body>

  <header class="topbar">
    <div class="container nav">
      <a class="brand" href="/">
        <div class="brand-mark"><img src="https://cdn.jsdelivr.net/gh/akonkia/domeknadrzewie@main/assets/img/logo.png" alt="Logo" /></div>
        <div style="margin-left:10px"><strong>Projekt: Domek na Drzewie</strong></div>
      </a>
      <nav class="nav-links">
        <a href="/">O projekcie</a>
        <a href="#" class="active">Materiały</a>
      </nav>
    </div>
  </header>

  <section class="hero">
    <h1>Miejskie kąpiele leśne</h1>
  </section>

  <main class="narrow">
    <nav class="filter-section">
      <div class="filter-group">
        <span class="filter-label">Sezon:</span>
        <button class="filter-btn active" data-type="season" data-val="All" onclick="applyFilter(this)">Wszystkie</button>
        <button class="filter-btn" data-type="season" data-val="Zima" onclick="applyFilter(this)">Zima</button>
        <button class="filter-btn" data-type="season" data-val="Wiosna" onclick="applyFilter(this)">Wiosna</button>
      </div>
      <div class="filter-group">
        <span class="filter-label">Miesiąc:</span>
        <button class="filter-btn" data-type="month" data-val="Styczeń" onclick="applyFilter(this)">Styczeń</button>
        <button class="filter-btn" data-type="month" data-val="Luty" onclick="applyFilter(this)">Luty</button>
        <button class="filter-btn" data-type="month" data-val="Marzec" onclick="applyFilter(this)">Marzec</button>
        <button class="filter-btn" data-type="month" data-val="Kwiecień" onclick="applyFilter(this)">Kwiecień</button>
      </div>
    </nav>

    <section id="materialList" class="material-list"></section>
  </main>

  <script>
    const cardsData = [
      { id: 1, title: "Cichy korzeń", theme: "Bezruch", season: "Zima", month: "Styczeń", body: "Wejdź powoli w zieloną przestrzeń. Rób częste pauzy. Usiądź lub stań nieruchomo na pięć minut.", reflection: ["Jakie dźwięki trwają, gdy otoczenie cichnie?", "Gdzie w moim ciele odczuwam stan bezruchu?"], img: "miejskie-kapiele-lesne-zima-styczen-01-cichy-korzen-A.png", imgB: "miejskie-kapiele-lesne-zima-styczen-01-cichy-korzen-B.png", blog: "DT_RCYoDvNk" },
      { id: 2, title: "Ukryta siła", theme: "Wytrwałość", season: "Zima", month: "Styczeń", body: "Szukaj oznak wytrwałości — igieł wiecznie zielonych, mchu, porostów, szczelnie zamkniętych pąków. Dotykaj ich delikatnie.", reflection: ["Co/kto pomógł mi przetrwać trudne pory roku?", "W jakich okolicznościach czuję w sobie spokój?"], img: "miejskie-kapiele-lesne-zima-styczen-02-ukryta-sila-A.png", imgB: "miejskie-kapiele-lesne-zima-styczen-02-ukryta-sila-B.png", blog: "DUEAsDsjI_j" },
      { id: 3, title: "Niespieszna Ścieżka", theme: "Powolność", season: "Zima", month: "Styczeń", body: "Idź o połowę wolniej niż zwykle. Niech twój oddech wyznacza rytm. Przy każdym kroku poczuj ziemię w pełni.", reflection: ["Co zaczynam zauważać dopiero wtedy, gdy nigdzie się nie spieszę?", "Dokąd w moim życiu biegnę bez potrzeby?"], img: "miejskie-kapiele-lesne-zima-styczen-03-niespieszna-sciezka-A.png", imgB: "miejskie-kapiele-lesne-zima-styczen-03-niespieszna-sciezka-B.png", blog: "DUV2YvGDUgG" },
      { id: 4, title: "Światło, które sięga do nas", theme: "Przebudzenie", season: "Zima", month: "Styczeń", body: "Unieś dłoń w stronę światła. Pozwól, by ciepło spoczęło na twoich ubraniach, na skórze, i rozświetliło cichą przestrzeń w tobie.", reflection: ["Która część mnie jest gotowa sięgnąć po coś nowego?", "Co rozgrzewa mnie od środka?"], img: "miejskie-kapiele-lesne-zima-styczen-04-zimowe-swiatlo-A.png", imgB: "miejskie-kapiele-lesne-zima-styczen-04-zimowe-swiatlo-B.png", blog: "DUn-M6TDKpW" },
      { id: 5, title: "Zimowy oddech", theme: "Odpoczynek", season: "Zima", month: "Luty", body: "Usiądź przy oknie lub na zewnątrz. Obserwuj miękkość każdego oddechu.", reflection: ["Co mogłoby znaczyć, odpoczywać bez poczucia winy?", "Które myśli wciąż krążą, a które mogę teraz wypuścić?"], img: "miejskie-kapiele-lesne-zima-luty-05-zimowy-oddech-A.png", imgB: "miejskie-kapiele-lesne-zima-luty-05-zimowy-oddech-B.png", blog: "DU6D4A6jk5L" },
      { id: 6, title: "Ukryta iskra", theme: "Subtelna energia", season: "Zima", month: "Luty", body: "Szukaj małych miejsc, w których gromadzi się ciepło. Może to promień słońca na ścianie, albo szalik ogrzany Twoim oddechem.", reflection: ["Jakie ciepło noszę w sobie?", "Gdzie w moim życiu coś się zaczyna?"], img: "miejskie-kapiele-lesne-zima-luty-06-ukryta-iskra-A.png", imgB: "miejskie-kapiele-lesne-zima-luty-06-ukryta-iskra-B.png", blog: "DVMH6kOjGq_" },
      { id: 7, title: "Oszroniony pąk", theme: "Potencjał", season: "Zima", month: "Luty", body: "Poszukaj krzewu albo drzewa i przyjrzyj się uważnie jego pąkom - małym obietnicom czekającym na odpowiednią chwilę.", reflection: ["Co dojrzewa we mnie po cichu?", "Jaki najmniejszy znak „już się zaczyna” potrafię dziś zauważyć?"], img: "miejskie-kapiele-lesne-zima-luty-07-oszroniony-pak-A.png", imgB: "miejskie-kapiele-lesne-zima-luty-07-oszroniony-pak-B.png", blog: "DVeJb09jrR4" },
      { id: 8, title: "Pierwszy Chór", theme: "Przebudzenie", season: "Zima", month: "Luty", body: "Wyjdź na 2–3 minuty i posłuchaj. Zauważ, że długo było cicho, a teraz ptasi śpiew wyraźnie się wybija. Najpierw uchwyć jeden głos, potem poszerz uwagę na cały chór.", reflection: ["Co czuję, gdy cisza pęka: ulgę, ciepło, napięcie, spokój?", "Jakie „pierwsze nuty” wracają do mojego życia po okresie milczenia?"], img: "miejskie-kapiele-lesne-zima-luty-08-pierwszy-chor-A.png", imgB: "miejskie-kapiele-lesne-zima-luty-08-pierwszy-chor-B.png", blog: "DVwK83jDq6L" },
      { id: 9, title: "Zimozielony", theme: "Stałość", season: "Zima", month: "Marzec", body: "Spędź chwilę przy jednym zimozielonym drzewie. Oddychaj razem z nim w rytmie: 4s wdech, 6s wydech.", reflection: ["Jakie małe rzeczy regularnie mnie uspokajają i podtrzymują?"], img: "miejskie-kapiele-lesne-zima-marzec-09-zimozielony-A.png", imgB: "miejskie-kapiele-lesne-zima-marzec-09-zimozielony-B.png", blog: "DWCI7kKDHlM" },
      { id: 10, title: "Odwilż", theme: "Rozluźnianie", season: "Wiosna", month: "Marzec", body: "Wyjdź na zewnątrz i poszukaj oznak roztopu: małych kałuż, ciemniejącej kory, cichego połysku mokrej ziemi.", reflection: ["Gdzie w moim życiu mogę bezpiecznie trochę zmięknąć?", "Co się zmienia, gdy pozwalam tej chwili być dokładnie taką, jaka jest, bez trzymania się i oporu?"], img: "miejskie-kapiele-lesne-wiosna-marzec-10-odwilz-A.png", imgB: "miejskie-kapiele-lesne-wiosna-marzec-10-odwilz-B.png", blog: "DWUK6lDjNqX" },
      { id: 11, title: "Przebudzenie Ziemi", theme: "Odradzanie", season: "Wiosna", month: "Marzec", body: "Wyjdź na zewnątrz i zatrzymaj się na moment. Wsłuchaj się w ciche sygnały powracającego życia: śpiew ptaków, dalekie nawoływania, łagodny ruch w gałęziach. Dostrzeż to, co nieśmiało się pojawia.", reflection: ["Jakie dźwięki zwiastują dla mnie odnowę?","Co zaczyna kiełkować w moim życiu, powoli, lecz pewnie?", "Czy potrafię pozwolić temu procesowi toczyć się we własnym rytmie?"], img: "miejskie-kapiele-lesne-wiosna-marzec-11-przebudzenie-ziemi-A.png", imgB: "miejskie-kapiele-lesne-wiosna-marzec-11-przebudzenie-ziemi-B.png", blog: "DWmN1KkDhq_" },
    {
  id: 12,
  title: "Poranne Szepty",
  theme: "Drobne zachwyty",
  season: "Wiosna",
  month: "Marzec",
  body: "Poświęć kilka minut każdego poranka, by usiąść przy oknie lub pod drzewem. Zamknij oczy, oddychaj spokojnie i pozwól swojej uwadze podążać za dźwiękami wczesnej wiosny — pierwszym śpiewem ptaków, szelestem gałęzi, cichym pulsem budzącego się życia. Zauważ, które z nich przywołują w Tobie spokój, ciekawość lub lekkość.",
  reflection: [
    "Które małe radości przemawiają do Ciebie teraz najgłośniej?",
    "Jak te subtelne momenty wpływają na Twój nastrój lub sposób patrzenia na dzień?",
    "Gdzie jeszcze w ciągu dnia możesz zatrzymać się, by usłyszeć tę cichą muzykę wokół siebie?"
  ],
  img: "wiosna-marzec-tydzien-12-poranne-szepty-wiosenne-paki-niebo-12A.png",
  imgB: "wiosna-marzec-tydzien-12-poranne-szepty-wiosenne-paki-niebo-12B.png",
  blog: "DWszgyEjOc_"
},
            { 
  id: 13,
  title: "Cichy powrót",
  theme: "Ciągłość",
  season: "Wiosna",
  month: "Marzec",
  body: "Odwiedź miejsce, do którego nie wracałeś/-aś od początku zimy. Zatrzymaj się przed wejściem. Zauważ swój oddech. Następnie wejdź powoli, pozwalając temu miejscu spotkać się z tobą takim/taką, jakim/jaką jesteś teraz.",
  reflection: [
    "Co się zmieniło?",
    "Co pozostało takie samo?",
    "Co w tobie także powraca?"
  ],
  img: "marzec-wiosna-tydzien-13-cwiczenie-uwaznosci-powrot-do-miejsca-13A.png",
  imgB: "marzec-wiosna-tydzien-13-cwiczenie-uwaznosci-powrot-do-miejsca-13B.png",
  blog: "2026/04/08/Cichy-powrot-cwiczenie-uwaznosci-na-wiosne/"
},
      { 
  id: 14,
  title: "Pąk w rozkwicie",
  theme: "Otwartość",
  season: "Wiosna",
  month: "Kwiecień",
  body: "Znajdź kwiat lub liść, który się otwiera. Zauważ jego kształt, krawędzie i kolor. Zauważ, co się zmienia.",
  reflection: [
    "Znajdź jedną rzecz, na którą chcesz się bardziej otworzyć. Co to jest?",
    "Pomyśl o czymś, przed czym się powstrzymywałeś(-aś). Jak blisko tego jesteś?",
    "Gdzie może być właściwe, żeby pozostać zamkniętym(-ą)?"
  ],
  img: "wiosna-kwiecien-tydzien-14-cwiczenie-uwaznosci-otwierajacy-sie-kwiat-14A.png",
  imgB: "wiosna-kwiecien-tydzien-14-cwiczenie-uwaznosci-otwierajacy-sie-kwiat-14AB.png",
  blog: "2026/04/10/otwieranie-sie-krok-po-kroku-cwiczenie-uwaznosci-inspirowane-natura.pl"
}
    ];

    const listElement = document.getElementById('materialList');
    const imgPath = "https://cdn.jsdelivr.net/gh/akonkia/domeknadrzewie@main/materialy/kapiele_miejskie/";

    function render(data, isSingleView = false) {
      if (!data.length) { listElement.innerHTML = "<p>Brak kart.</p>"; return; }
      
      const firstId = 1;
      const lastId = Math.max(...cardsData.map(c => c.id));

      listElement.innerHTML = data.map(card => `
        <article class="material-item">
          <div class="material-visual"><img src="${imgPath}${card.img}?v=2026" alt="${card.title}"></div>
          <div class="material-content">
            <header>
              <span class="material-meta">${card.season} • ${card.month} • ${card.theme}</span>
              <h3>Tydzień ${card.id.toString().padStart(2, '0')} - ${card.title}</h3>
            </header>
            <div class="material-body">${card.body}</div>
            <div class="material-reflection">
              <strong>Refleksja:</strong>
              <ul>${card.reflection.map(q => `<li>${q}</li>`).join('')}</ul>
            </div>
            <div class="download-links">
              <a href="${imgPath}${card.img}?v=2026" download class="btn-main">Obraz</a>
              <a href="${imgPath}${card.imgB}?v=2026" download class="btn-alt">Zadanie</a>
              <button onclick="copyLink(${card.id})" class="btn-copy">🔗 Kopiuj link</button>
              <a href="https://domeknadrzewie.edu.pl/blog/${card.blog}/" target="_blank" class="btn-blog">Blog</a>
          
            </div>
            ${isSingleView ? `
            <div class="week-nav-row">
              <button class="nav-arrow-btn ${card.id <= firstId ? 'disabled' : ''}" onclick="showSpecificWeek(${card.id - 1})">← Poprzedni</button>
              <button class="nav-arrow-btn ${card.id >= lastId ? 'disabled' : ''}" onclick="showSpecificWeek(${card.id + 1})">Następny →</button>
            </div>` : ''}
          </div>
        </article>
      `).join('');
    }

    function copyLink(id) {
      const url = window.location.origin + window.location.pathname + '#tydzien-' + id;
      navigator.clipboard.writeText(url).then(() => {
        const btn = event.currentTarget;
        const originalText = btn.innerHTML;
        btn.innerHTML = "✅ Skopiowano!";
        setTimeout(() => { btn.innerHTML = originalText; }, 2000);
      });
    }

    function applyFilter(btn) {
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      const type = btn.getAttribute('data-type');
      const val = btn.getAttribute('data-val');
      
      const filtered = val === 'All' ? cardsData : cardsData.filter(c => c[type] === val);
      
      if (type === 'month') {
        render([filtered[0]], true);
      } else {
        const sorted = [...filtered].sort((a,b) => b.id - a.id);
        render(sorted, false);
      }
    }

    function showSpecificWeek(id) {
      const card = cardsData.find(c => c.id === id);
      if (card) {
        window.location.hash = 'tydzien-' + id;
        render([card], true);
        window.scrollTo({top: listElement.offsetTop - 100, behavior: 'smooth'});
      }
    }

    function handleRouting() {
      const hash = window.location.hash;
      if (hash && hash.startsWith('#tydzien-')) {
        const id = parseInt(hash.replace('#tydzien-', ''));
        if (!isNaN(id)) {
          showSpecificWeek(id);
          return true;
        }
      }
      return false;
    }

    window.addEventListener('hashchange', handleRouting);
    window.addEventListener('DOMContentLoaded', () => {
      if (!handleRouting()) {
        const latest = [...cardsData].sort((a,b) => b.id - a.id)[0];
        render([latest], true);
      }
    });
  </script>
</body>
</html>

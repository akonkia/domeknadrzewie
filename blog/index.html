---
layout: default
title: Blog
---

<section class="blog-index">
  <style>
    .blog-intro {
      text-align: center;
      margin-bottom: 34px;
    }

    .blog-intro h1 {
      margin: 0 0 10px;
      font-size: clamp(2rem, 5vw, 3.4rem);
      text-transform: uppercase;
    }

    .blog-intro p {
      margin: 0 auto;
      max-width: 60ch;
      color: #5e675f;
      line-height: 1.8;
    }

    .post-list {
      display: grid;
      gap: 18px;
    }

    .post-link {
      display: block;
      text-decoration: none;
      color: inherit;
    }

    .post-card {
      background: rgba(255,255,255,0.9);
      border: 1px solid rgba(36,49,38,0.08);
      border-radius: 18px;
      padding: 22px 24px;
      box-shadow: 0 14px 30px rgba(36,49,38,0.06);
      transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
    }

    .post-link:hover .post-card,
    .post-link:focus .post-card {
      transform: translateY(-2px);
      box-shadow: 0 18px 36px rgba(36,49,38,0.10);
      border-color: rgba(103,135,96,0.35);
    }

    .post-card time {
      display: block;
      color: #5e675f;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      font-size: 0.8rem;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .post-card h2 {
      margin: 0 0 8px;
      font-size: 1.4rem;
      line-height: 1.2;
    }

    .post-card p {
      margin: 0;
      color: #5e675f;
      line-height: 1.75;
    }

    .read-more {
      display: inline-block;
      margin-top: 14px;
      font-size: 0.84rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: #678760;
    }
  </style>

  <div class="blog-intro">
    <h1>Blog</h1>
    <p>A timeline of the project: notes, milestones, materials, and slow growth.</p>
  </div>

  <div class="post-list">
    {% for post in site.posts %}
      <a class="post-link" href="{{ post.url }}">
        <article class="post-card">
          <time datetime="{{ post.date | date_to_xmlschema }}">{{ post.date | date: "%-d %B %Y" }}</time>
          <h2>{{ post.title }}</h2>
          {% if post.excerpt %}
            <p>{{ post.excerpt | strip_html }}</p>
          {% endif %}
          <span class="read-more">Open post</span>
        </article>
      </a>
    {% endfor %}
  </div>
</section>

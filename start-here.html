<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Projekt: Domek na Drzewie</title>

<link rel="stylesheet" href="/assets/css/main.css">

<style>
/* =========================
   🌲 PARALLAX SECTION
========================= */

.parallax-section {
  position: relative;
  height: 80vh;
  overflow: hidden;
}

/* layers container */
.parallax {
  position: absolute;
  inset: 0;
}

/* layers */
.layer {
  position: absolute;
  inset: -5%;
  background-size: cover;
  background-position: center;
  will-change: transform;
}

/* images */
.layer.back {
  background-image: url('https://github.com/akonkia/domeknadrzewie/raw/c69b90e90c9b265bf8f944153b34e1339df4bbc9/assets/img/fores-back.png');
}

.layer.mid {
      background-image: url('https://github.com/akonkia/domeknadrzewie/raw/c69b90e90c9b265bf8f944153b34e1339df4bbc9/assets/img/forest-front.png');

}

.layer.front {
  background-image: url('https://github.com/akonkia/domeknadrzewie/raw/c69b90e90c9b265bf8f944153b34e1339df4bbc9/assets/img/forest-mid.png');
  pointer-events: none;
}

/* overlay for readability */
.parallax::after {
  content: "";
  position: absolute;
  inset: 0;
  background: rgba(15,30,20,0.25);
}

/* text inside */
.parallax-content {
  position: relative;
  z-index: 2;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  color: white;
}

.parallax-content h1 {
  font-size: clamp(2.5rem, 6vw, 4rem);
  font-weight: 300;
  letter-spacing: 0.05em;
}

/* =========================
   minor polish
========================= */

body {
  margin: 0;
  font-family: Inter, Arial, sans-serif;
}

.section {
  padding: 60px 20px;
  max-width: 900px;
  margin: auto;
}

.footer {
  padding: 40px;
  text-align: center;
  border-top: 1px solid #ddd;
}
</style>
</head>

<body>

<!-- =========================
     HEADER (your menu)
========================= -->
<header class="topbar">
  <div class="container nav">
    <div class="brand">
      <div class="brand-mark">
        <img src="https://cdn.jsdelivr.net/gh/akonkia/domeknadrzewie@main/assets/img/logo.png">
      </div>
      <div>
        <div class="brand-title">Projekt: Domek na Drzewie</div>
        <div class="brand-subtitle">Projekt edukacyjno-społeczny inspirowany naturą.</div>
      </div>
    </div>

    <nav class="nav-links">
      <a href="#">O projekcie</a>
      <a href="/materialy/">Materiały</a>
      <a href="/blog/">Blog</a>
      <a href="/en/">English</a>
    </nav>
  </div>
</header>

<!-- =========================
     🌲 PARALLAX HERO SECTION
========================= -->
<section class="parallax-section">
  <div class="parallax">
    <div class="layer back"></div>
    <div class="layer mid"></div>
    <div class="layer front"></div>
  </div>

  <div class="parallax-content">
    <h1>Start here</h1>
  </div>
</section>



<!-- =========================
     FOOTER
========================= -->
<footer class="footer">
  <strong>Projekt: Domek na Drzewie</strong><br>
  2026
</footer>

<!-- =========================
     PARALLAX SCRIPT
========================= -->
<script>
const section = document.querySelector('.parallax-section');
const layers = document.querySelectorAll('.layer');

document.addEventListener('mousemove', (e) => {
  const rect = section.getBoundingClientRect();

  const x = (e.clientX - rect.left) / rect.width - 0.5;
  const y = (e.clientY - rect.top) / rect.height - 0.5;

  layers.forEach((layer, i) => {
    const depth = [6, 14, 28][i];
    layer.style.transform =
      `translate3d(${x * depth}px, ${y * depth}px, 0)`;
  });
});
</script>

</body>
</html>

name: Generate Tag Archives

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Generate tag archive pages
        run: python3 scripts/generate_tag_archives.py

      - name: Commit generated pages
        run: |
          if git diff --quiet -- blog/tag blog/en/tag; then
            echo "No tag archive changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add blog/tag blog/en/tag
          git commit -m "Generate tag archives"
          git push

<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>404</title>
  <meta name="robots" content="noindex">

  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      text-align: center;
      padding: 80px 20px;
      color: #2f3e2f;
      background: #fafafa;
    }

    h1 {
      font-size: 2.2rem;
      margin-bottom: 10px;
    }

    p {
      font-size: 1.1rem;
      line-height: 1.6;
      opacity: 0.85;
    }

    a {
      display: inline-block;
      margin: 10px 8px;
      padding: 10px 16px;
      border-radius: 999px;
      text-decoration: none;
      background: #e6f0e6;
      color: #2f3e2f;
    }

    a:hover {
      background: #d6e6d6;
    }
  </style>
</head>

<body>

  <h1 id="title"></h1>
  <p id="desc"></p>
  <p><em id="hint"></em></p>

  <div>
    <a href="/" id="home"></a>
    <a href="/materialy/" id="materials"></a>
    <a href="/blog/" id="blog"></a>
  </div>

  <p id="footer" style="margin-top:30px; font-size:0.95rem; opacity:0.6;"></p>

<script>
(function () {
  const isEN = window.location.pathname.startsWith("/en");

  if (isEN) {
    document.documentElement.lang = "en";

    document.getElementById("title").textContent = "🌿 You missed the path";
    document.getElementById("desc").innerHTML =
      "This page may have shifted, softened, or disappeared into the undergrowth.";
    document.getElementById("hint").textContent =
      "Here’s where you probably meant to go:";

    document.getElementById("home").textContent = "Home";
    document.getElementById("materials").textContent = "Materials";
    document.getElementById("materials").href = "/en/materials/";
    document.getElementById("blog").textContent = "Blog";
    document.getElementById("blog").href = "/en/blog/";

    document.getElementById("footer").textContent =
      "Sometimes getting lost is also part of the path.";

  } else {
    document.documentElement.lang = "pl";

    document.getElementById("title").textContent = "🌿 Zgubiłeś ścieżkę";
    document.getElementById("desc").innerHTML =
      "Ta strona mogła się zmienić, przesunąć albo zniknąć gdzieś między gałęziami.";
    document.getElementById("hint").textContent =
      "Możesz spróbować tutaj:";

    document.getElementById("home").textContent = "Strona główna";
    document.getElementById("materials").textContent = "Materiały";
    document.getElementById("blog").textContent = "Blog";

    document.getElementById("footer").textContent =
      "Czasem nie trafienie od razu też jest częścią drogi.";
  }
})();
</script>

</body>
</html>

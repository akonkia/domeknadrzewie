  <meta charset="UTF-8">
  <title>404</title>

  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0a140d; 
      color: #ffffff;
      font-family: system-ui, -apple-system, sans-serif;
    }

    #bg-container {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      z-index: 1;
      background-image: url('/assets/img/yoal-desurmont-jqgsM3B9Fpo-unsplash.jpg'); 
      background-size: cover;
      background-position: center;
    }

    #bg-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      z-index: 2;
      /* Softened the gradient for a more natural forest look */
      background: radial-gradient(circle, rgba(0, 10, 5, 0.75) 0%, rgba(0, 10, 5, 0.2) 100%);
    }

    canvas {
      position: absolute;
      top: 0; left: 0;
      z-index: 5;
      cursor: crosshair;
    }

    #ui-container {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 10;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
      box-sizing: border-box;
      pointer-events: none; 
      user-select: none;
    }

    h1 {
      font-size: clamp(2.2rem, 7vw, 4rem);
      margin: 0 0 10px 0;
      color: #d4ff00;
      font-weight: 500;
    }

    p {
      font-size: clamp(1rem, 3vw, 1.15rem);
      max-width: 600px;
      opacity: 0.9;
      line-height: 1.5;
      margin: 5px 0;
    }

    .links {
      margin-top: 25px;
      pointer-events: auto; 
    }

    a {
      display: inline-block;
      margin: 8px;
      padding: 12px 28px;
      border-radius: 999px;
      text-decoration: none;
      background: rgba(212, 255, 0, 0.1);
      color: #d4ff00;
      border: 1px solid rgba(212, 255, 0, 0.3);
      transition: all 0.3s ease;
      font-weight: 600;
      backdrop-filter: blur(4px);
    }

    a:hover {
      background: rgba(212, 255, 0, 0.2);
      border-color: #d4ff00;
      transform: translateY(-2px);
    }

    /* FIXED: Hint now sits below the buttons relatively */
    #draw-hint {
      margin-top: 40px;
      color: #d4ff00;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      opacity: 0.6;
      animation: pulse 2.5s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.2; transform: scale(0.98); }
      50% { opacity: 0.7; transform: scale(1.02); }
    }

    #footer {
      position: absolute;
      bottom: 20px;
      font-size: 0.8rem;
      opacity: 0.5;
      width: 90%;
      max-width: 500px;
    }
  </style>
</head>

<body>

  <div id="bg-container"></div>
  <div id="bg-overlay"></div>
  <canvas id="fireflyCanvas"></canvas>

  <div id="ui-container">
    <h1 id="title"></h1>
    <p id="desc"></p>
    <p><em id="hint"></em></p>

    <div class="links" id="button-zone">
      <a href="/" id="home"></a>
      <a href="/materialy/" id="materials"></a>
      <a href="/blog/" id="blog"></a>
    </div>

    <div id="draw-hint">✦ Maluj światłem na mchu ✦</div>
    
    <p id="footer"></p>
  </div>

<script>
(function () {
  const isEN = window.location.pathname.startsWith("/en");
  const drawHint = document.getElementById("draw-hint");
  const buttonZone = document.getElementById("button-zone");
  let hasInteracted = false;
  let excludedRects = [];

  if (isEN) {
    document.documentElement.lang = "en";
    document.getElementById("title").textContent = "🌿 You missed the path";
    document.getElementById("desc").textContent = "This page may have shifted, softened, or disappeared into the undergrowth.";
    document.getElementById("hint").textContent = "Try one of these paths:";
    document.getElementById("home").textContent = "Home";
    document.getElementById("materials").textContent = "Materials";
    document.getElementById("materials").href = "/en/materials/";
    document.getElementById("blog").textContent = "Blog";
    document.getElementById("blog").href = "/blog/en/";
    document.getElementById("footer").textContent = "Sometimes getting lost is part of the journey.";
    drawHint.textContent = "✦ Draw with light on the moss ✦";
  } else {
    document.getElementById("title").textContent = "🌿 Zgubiłeś ścieżkę";
    document.getElementById("desc").textContent = "Ta strona mogła się zmienić, przesunąć albo zniknąć gdzieś między gałęziami.";
    document.getElementById("hint").textContent = "Możesz spróbować tutaj:";
    document.getElementById("home").textContent = "Strona główna";
    document.getElementById("materials").textContent = "Materiały";
    document.getElementById("blog").textContent = "Blog";
    document.getElementById("footer").textContent = "Czasem nietrafienie od razu też jest częścią drogi.";
  }

  const canvas = document.getElementById("fireflyCanvas");
  const ctx = canvas.getContext("2d");
  let fireflies = [];

  function init() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    updateExcludedZones();
  }

  function updateExcludedZones() {
    const buttons = buttonZone.querySelectorAll('a');
    excludedRects = Array.from(buttons).map(btn => btn.getBoundingClientRect());
  }

  class Firefly {
    constructor(x, y) {
      this.x = x; this.y = y;
      this.vx = (Math.random() - 0.5) * 0.4;
      this.vy = (Math.random() - 0.5) * 0.4;
      this.size = Math.random() * 2 + 1.5;
      this.life = 1.0;
      this.decay = 0.008 + Math.random() * 0.01;
      this.hue = Math.random() * 15 + 55; 
    }
    update() {
      this.x += this.vx; this.y += this.vy;
      this.life -= this.decay;
    }
    draw() {
      if (this.life <= 0) return;
      const isOverButton = excludedRects.some(r => this.x > r.left && this.x < r.right && this.y > r.top && this.y < r.bottom);
      if (isOverButton) return;

      ctx.save();
      ctx.globalCompositeOperation = 'screen';
      const g = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.size * 10);
      g.addColorStop(0, `hsla(${this.hue}, 100%, 70%, ${this.life * 0.3})`);
      g.addColorStop(1, `hsla(${this.hue}, 100%, 70%, 0)`);
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(this.x, this.y, this.size * 10, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = `hsla(${this.hue}, 100%, 85%, ${this.life})`;
      ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI*2); ctx.fill();
      ctx.restore();
    }
  }

  function handleInput(x, y) {
    if(!hasInteracted) { 
      hasInteracted = true; 
      drawHint.style.visibility = 'hidden'; 
    }
    for(let i=0; i<3; i++) fireflies.push(new Firefly(x, y));
  }

  function animate() {
    updateExcludedZones();
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for (let i = fireflies.length - 1; i >= 0; i--) {
      fireflies[i].update(); 
      fireflies[i].draw();
      if (fireflies[i].life <= 0) fireflies.splice(i, 1);
    }
    requestAnimationFrame(animate);
  }

  window.addEventListener('mousemove', e => handleInput(e.clientX, e.clientY));
  window.addEventListener('touchmove', e => handleInput(e.touches[0].clientX, e.touches[0].clientY));
  window.addEventListener('resize', init);
  init(); animate();
})();
</script>

</body>

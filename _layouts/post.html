---
layout: default
---
<article class="post">
  <style>
    .post-header {
      margin-bottom: 28px;
      text-align: center;
    }

    .post-date {
      color: #5e675f;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      font-size: 0.82rem;
      font-weight: 800;
      margin-bottom: 10px;
    }

    .post h1 {
      margin: 0;
      font-size: clamp(2rem, 5vw, 3.4rem);
      line-height: 1.02;
      text-transform: uppercase;
    }

    .post-cover-wrap {
      margin: 26px 0 28px;
      display: flex;
      justify-content: center;
    }

    .post-cover {
      display: block;
      width: 100%;
      max-width: 760px;
      aspect-ratio: 16 / 9;
      object-fit: cover;
      border-radius: 18px;
      border: 1px solid rgba(36,49,38,0.08);
      box-shadow: 0 14px 30px rgba(36,49,38,0.08);
      background: #fff;
    }

    .post-body {
      background: rgba(255,255,255,0.88);
      border: 1px solid rgba(36,49,38,0.08);
      border-radius: 18px;
      padding: 28px;
      line-height: 1.8;
      box-shadow: 0 14px 30px rgba(36,49,38,0.06);
    }

    .post-body h2 {
      margin-top: 1.8em;
      margin-bottom: 0.6em;
      font-size: 1.2rem;
      text-transform: uppercase;
    }

    .post-body p,
    .post-body ul {
      margin: 0 0 1.1em;
    }

    .post-body hr {
      border: 0;
      border-top: 1px solid rgba(36,49,38,0.10);
      margin: 2rem 0;
    }
  </style>

  {% assign cover_image = page.cover | default: '/assets/img/blog/default-cover.png' %}
  {% assign cover_alt = page.cover_alt | default: page.title %}

  <header class="post-header">
    <div class="post-date">{{ page.date | date: "%-d %B %Y" }}</div>
    <h1>{{ page.title }}</h1>
  </header>

  <div class="post-cover-wrap">
    <img class="post-cover" src="{{ cover_image }}" alt="{{ cover_alt }}">
  </div>

  <div class="post-body">
    {{ content }}
  </div>
</article>

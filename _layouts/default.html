<!DOCTYPE html>
<html lang="{{ page.lang | default: 'pl' }}">
<head>
  <link rel="stylesheet" href="/assets/css/main.css">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>{% if page.title %}{{ page.title }} | {% endif %}Domek na Drzewie</title>

  <style>
    :root {
      --sage: #678760;
      --text: #243126;
      --muted: #5e675f;
      --line: rgba(36,49,38,0.10);
      --max: 1120px;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, Arial, sans-serif;
      background: #f3f1eb;
      color: var(--text);
    }

    .container {
      width: min(calc(100% - 32px), var(--max));
      margin: 0 auto;
    }

    .topbar {
      background: rgba(255,255,255,0.94);
      border-bottom: 1px solid rgba(36,49,38,0.08);
      position: sticky;
      top: 0;
      z-index: 40;
    }

    .nav {
      min-height: 96px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .brand-mark {
      width: 58px;
      height: 58px;
      border-radius: 50%;
      overflow: hidden;
    }

    .brand-mark img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .brand-title {
      font-size: 1.2rem;
      font-weight: 800;
    }

    /* DESKTOP NAV */
    .nav-links {
      display: flex;
    }

    .nav-links a {
      padding: 0 20px;
      display: flex;
      align-items: center;
      min-height: 96px;
    }

    /* HAMBURGER */
    .menu-toggle {
      display: none;
      font-size: 22px;
      background: none;
      border: 1px solid rgba(36,49,38,0.15);
      border-radius: 8px;
      padding: 6px 10px;
      cursor: pointer;
    }

    /* MOBILE */
    @media (max-width: 900px) {
      .nav {
        flex-direction: column;
        align-items: flex-start;
      }

      .menu-toggle {
        display: block;
        margin-top: 10px;
      }

      .nav-links {
        display: none;
        flex-direction: column;
        width: 100%;
        background: white;
        border-top: 1px solid rgba(36,49,38,0.06);
      }

      .nav-links.active {
        display: flex;
      }

      .nav-links a {
        min-height: 56px;
        padding: 0 16px;
        border-bottom: 1px solid rgba(36,49,38,0.06);
      }
    }
  </style>
</head>

<body>

<header class="topbar">
  <div class="container nav">

    <a class="brand" href="/">
      <span class="brand-mark">
        <img src="https://raw.githubusercontent.com/akonkia/domeknadrzewie/main/assets/img/logo.png" alt="Logo" />
      </span>
      <span class="brand-title">Domek na Drzewie</span>
    </a>

    <button class="menu-toggle" aria-label="Menu">☰</button>

    <nav class="nav-links">
      <a href="/">Home</a>
      <a href="/materialy/">Materiały</a>
      <a href="/blog/">Blog</a>
    </nav>

  </div>
</header>

<main class="container">
  {{ content }}
</main>

<script>
document.addEventListener("DOMContentLoaded", function () {
  const toggle = document.querySelector('.menu-toggle');
  const nav = document.querySelector('.nav-links');

  if (toggle && nav) {
    toggle.addEventListener('click', () => {
      nav.classList.toggle('active');
    });

    document.querySelectorAll('.nav-links a').forEach(link => {
      link.addEventListener('click', () => {
        nav.classList.remove('active');
      });
    });
  }
});
</script>

</body>
</html>

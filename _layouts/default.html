<!DOCTYPE html>
<html lang="{{ page.lang | default: 'pl' }}">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% if page.title %}{{ page.title }} | {% endif %}Domek na Drzewie</title>
  <meta name="description" content="{% if page.excerpt %}{{ page.excerpt | strip_html | normalize_whitespace | truncate: 160 }}{% else %}Nature-inspired writing, reflections, and educational materials.{% endif %}" />

  <style>
    :root {
      --sage: #678760;
      --cream: #f5f4ef;
      --text: #243126;
      --muted: #5e675f;
      --line: rgba(36,49,38,0.10);
      --max: 1120px;
      --shadow: 0 14px 30px rgba(36,49,38,0.06);
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      font-family: Inter, Arial, Helvetica, sans-serif;
      background: #f3f1eb;
      color: var(--text);
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .container {
      width: min(calc(100% - 32px), var(--max));
      margin: 0 auto;
    }

    .topbar {
      background: rgba(255,255,255,0.94);
      border-bottom: 1px solid rgba(36,49,38,0.08);
      position: sticky;
      top: 0;
      z-index: 40;
      backdrop-filter: blur(10px);
    }

    .nav {
      min-height: 96px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
      min-width: 0;
    }

    .brand-mark {
      width: 58px;
      height: 58px;
      border-radius: 50%;
      overflow: hidden;
      background: #fff;
      border: 1px solid rgba(36,49,38,0.08);
      flex-shrink: 0;
      box-shadow: var(--shadow);
    }

    .brand-mark img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .brand-text {
      min-width: 0;
    }

    .brand-title {
      font-size: 1.2rem;
      font-weight: 800;
      letter-spacing: 0.01em;
      line-height: 1.1;
    }

    .brand-subtitle {
      margin-top: 4px;
      font-size: 0.88rem;
      color: var(--muted);
      line-height: 1.3;
    }

    .nav-links {
      display: flex;
      align-items: stretch;
      gap: 0;
      flex-wrap: wrap;
      {% if page.lang == 'pl' %}
  <a href="/en/blog/">
    <span class="nav-label"><span class="nav-pl">English Version</span></span>
  </a>
{% else %}
  <a href="/blog/">
    <span class="nav-label"><span class="nav-pl">Polska wersja</span></span>
  </a>
{% endif %}
    }

    .nav-links a {
      min-height: 96px;
      padding: 0 26px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-left: 1px solid rgba(36,49,38,0.06);
      transition: 0.18s ease;
      text-align: center;
    }

    .nav-links a:hover,
    .nav-links a.active {
      background: var(--sage);
      color: white;
    }

    .nav-label {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      line-height: 1.08;
      gap: 4px;
    }

    .nav-pl {
      display: block;
      font-size: 0.94rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .nav-en {
      display: block;
      font-size: 0.72rem;
      font-weight: 600;
      opacity: 0.82;
      letter-spacing: 0.03em;
    }

    .page {
      padding: 42px 0 56px;
    }

    .footer {
      border-top: 1px solid var(--line);
      padding: 24px 0 36px;
      color: var(--muted);
      font-size: 0.95rem;
    }

    @media (max-width: 900px) {
      .nav {
        padding: 12px 0 16px;
        flex-direction: column;
        align-items: flex-start;
      }

      .brand {
        width: 100%;
      }

      .nav-links {
        width: 100%;
        border-top: 1px solid rgba(36,49,38,0.06);
      }

      .nav-links a {
        min-height: 78px;
        padding: 0 18px;
        border-left: none;
        border-right: 1px solid rgba(36,49,38,0.06);
        flex: 1 1 0;
      }
    }

    @media (max-width: 640px) {
      .brand-mark {
        width: 50px;
        height: 50px;
      }

      .brand-title {
        font-size: 1.08rem;
      }

      .brand-subtitle {
        font-size: 0.82rem;
      }

      .nav-links {
        display: grid;
        grid-template-columns: 1fr;
      }

      .nav-links a {
        min-height: 66px;
        border-right: none;
        border-bottom: 1px solid rgba(36,49,38,0.06);
      }
    }
    .sky-mini-card {
  display: block;
  margin-bottom: 32px;
  border-radius: 18px;
  overflow: hidden;
  box-shadow: 0 14px 30px rgba(36,49,38,0.08);
}

.sky-mini-scene {
  position: relative;
  height: 200px;
  background: linear-gradient(180deg, #d9ebf6 0%, #f3e4c9 70%);
  overflow: hidden;
  transition: background 0.8s ease;
}
    {% if page.translation_id %}
  {% assign translations = site.posts | where: "translation_id", page.translation_id %}
  {% for trans in translations %}
    <link rel="alternate" hreflang="{{ trans.lang }}" href="{{ site.url }}{{ trans.url }}" />
  {% endfor %}
{% endif %}
  </style>
</head>
<body>
  <header class="topbar">
    <div class="container nav">
      <a class="brand" href="/">
        <span class="brand-mark">
          <img src="https://raw.githubusercontent.com/akonkia/domeknadrzewie/main/assets/img/logo.png" alt="Domek na Drzewie logo" />
        </span>
        <span class="brand-text">
          <span class="brand-title">Projekt: Domek na Drzewie - The Tree House Project</span>
          <span class="brand-subtitle">Blog</span>
        </span>
      </a>

      <nav class="nav-links" aria-label="Navigation">
        <a href="/">
          <span class="nav-label">
            <span class="nav-pl">Strona główna</span>
            <span class="nav-en">Home</span>
          </span>
        </a>

        <a href="/materialy/">
          <span class="nav-label">
            <span class="nav-pl">Materiały</span>
            <span class="nav-en">Materials</span>
          </span>
        </a>

        <a href="/blog/" class="{% if page.url == '/blog/' or page.layout == 'post' %}active{% endif %}">
          <span class="nav-label">
            <span class="nav-pl">Blog</span>
            <span class="nav-en">Blog</span>
          </span>
        </a>
      </nav>
    </div>
  </header>

  <main class="page">
    <div class="container">
      {{ content }}
    </div>
  </main>

  <footer class="footer">
    <div class="container">
      Domek na Drzewie • project timeline
    </div>
  </footer>
</body>
</html>

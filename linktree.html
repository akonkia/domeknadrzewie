<!DOCTYPE html>
<html lang="pl">
<head>
      <script>
    window.dataLayer = window.dataLayer || [];

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uważność | Projekt: Domek na Drzewie</title>
    <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --sage: #678760;
            --dark-green: #243126;
            --cream: #f8f6f2;
            --accent: #fb9b27;
            --white: #ffffff;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            background-color: var(--cream);
            background-image: url("https://www.transparenttextures.com/patterns/felt.png");
            color: var(--dark-green);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 480px;
            padding: 60px 24px;
            box-sizing: border-box;
            text-align: center;
        }

        a {
            color: var(--dark-green);
            text-decoration: none;
            -webkit-tap-highlight-color: transparent;
        }

        a:visited {
            color: var(--dark-green);
        }

        .logo {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            margin-bottom: 20px;
            box-shadow: 0 10px 25px rgba(103, 135, 96, 0.15);
            border: 3px solid var(--white);
        }

        h1 {
            font-family: 'Bodoni Moda', serif;
            font-size: 1.8rem;
            margin: 0 0 10px 0;
            letter-spacing: -0.5px;
            color: var(--dark-green);
        }

        .subtitle {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--sage);
            font-weight: 600;
            margin-bottom: 45px;
        }

        /* Główna karta */
        .main-link {
            position: relative;
            display: block;
            width: 100%;
            aspect-ratio: 16 / 9;
            border-radius: 20px;
            overflow: hidden;
            margin-bottom: 25px;
            box-shadow: 0 15px 35px rgba(36, 49, 38, 0.12);
            transition: transform 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
        }

        .main-link:active {
            transform: scale(0.98);
        }

        .main-link img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: brightness(0.85) contrast(1.05);
        }

        .main-link .overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 25px;
            background: linear-gradient(transparent, rgba(36, 49, 38, 0.85));
            color: var(--white);
            text-align: left;
        }

        .main-link .tag {
            background: var(--accent);
            color: var(--white);
            padding: 4px 12px;
            border-radius: 4px;
            font-size: 0.65rem;
            font-weight: 800;
            text-transform: uppercase;
            margin-bottom: 10px;
            display: inline-block;
        }

        .main-link h2 {
            margin: 0;
            font-family: 'Bodoni Moda', serif;
            font-size: 1.5rem;
            color: var(--white);
        }

        /* Przyciski mniejsze */
        .secondary-links {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .sec-btn {
            background: var(--white);
            padding: 20px 12px;
            border-radius: 18px;
            font-size: 0.78rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border: 1px solid rgba(103, 135, 96, 0.15);
            box-shadow: 0 4px 12px rgba(36, 49, 38, 0.04);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--dark-green) !important;
        }

        /* Wyróżnienie artykułu */
        .btn-highlight {
            background: #fdfaf5;
            border: 1px solid var(--sage);
        }

        .sec-btn:active {
            background: var(--sage);
            color: var(--white) !important;
            transform: translateY(2px);
        }

        .full-width {
            grid-column: span 2;
        }

        /* Poprawiona widoczność stopki */
        .footer {
            margin-top: 50px;
            font-family: 'Bodoni Moda', serif;
            font-size: 1rem;
            font-style: italic;
            color: var(--dark-green); /* Ciemniejszy kolor dla czytelności */
            line-height: 1.4;
            padding: 0 10px;
        }

        .fade-in {
            animation: fadeIn 1.2s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="container fade-in">
        <img src="https://cdn.jsdelivr.net/gh/akonkia/domeknadrzewie@main/assets/img/logo.png" alt="Logo" class="logo">
        <h1>Uważność w Mieście</h1>
        <p class="subtitle">Projekt: Domek na Drzewie</p>

        <a href="https://domeknadrzewie.edu.pl/materialy/kapiele_miejskie/#tydzien-13" class="main-link">
            <img src="https://cdn.jsdelivr.net/gh/akonkia/domeknadrzewie@main/materialy/kapiele_miejskie/wiosna-kwiecien-tydzien-14-cwiczenie-uwaznosci-otwierajacy-sie-kwiat-14A.png" alt="Tydzień 14">
            <div class="overlay">
                <span class="tag">Aktualna karta</span>
                <h2>Tydzień 14: Kwiat w rozkwicie</h2>
            </div>
        </a>

        <div class="secondary-links">
            <a href="https://domeknadrzewie.edu.pl/blog/2026/04/03/Miejskie-kapiele-lesne-jak-praktykowac-Shinrin-yoku-bez-wyjezdzania-z-miasta/" class="sec-btn full-width btn-highlight">
                📖 Czym są miejskie kąpiele uważności? (Przewodnik)
            </a>

            <a href="https://domeknadrzewie.edu.pl/materialy/kapiele_miejskie/" class="sec-btn">
                Wszystkie karty
            </a>
            <a href="https://domeknadrzewie.edu.pl/" class="sec-btn">
                O projekcie
            </a>
            
            <a href="https://www.instagram.com/projekt.domeknadrzewie" class="sec-btn full-width">
                Obserwuj na Instagramie
            </a>
        </div>

        <div class="footer">
            „Zatrzymaj się na chwilę w miejskiej dżungli,<br>by usłyszeć bicie serca natury.”
        </div>
    </div>

</body>
</html>
